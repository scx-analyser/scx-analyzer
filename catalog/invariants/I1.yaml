# Invariant I1 - calling context & locking requirements of sched_ext kfuncs.
#
# Source of truth: Linux v7.1 (see KERNEL_VERSION), kernel/sched/ext.c,
# kernel/sched/ext_idle.c, kernel/bpf/{verifier,btf}.c. Write-up: I1.md.
#
# Granularity: one entry per kfunc set (or per group of kfuncs sharing the
# same context rule / enforcement), with an explicit `applies_to` list. Every
# sched_ext kfunc registered in v7.1 (59 unique names) appears in exactly one
# entry; I1.13/I1.14 additionally apply to all of them ("*").
#
# Conventions used in this file (to be reconciled with the A2 schema):
# - requires.contexts: "ops.<cb>" = BPF program attached to that sched_ext_ops
#   member; "prog:SYSCALL" / "prog:TRACING" = non-struct_ops BPF program
#   types; "SCX_KF_ALLOW_*" = the per-op allow flag (ext.c:9815) that grants
#   the set. "UNLOCKED ops" are the ops mapped to SCX_KF_ALLOW_UNLOCKED in
#   scx_kf_allow_flags[] (ext.c:9828-9850).
# - requires.locks: symbolic lock state the kfunc relies on:
#   rq(this_cpu), rq(task_rq(p)), pi_lock(p), dsq(<which>), irqs_disabled,
#   no_bpf_spin_lock, none.
# - enforcement_expected: "static" = BPF verifier (kfunc set registration per
#   prog type + scx_kfunc_context_filter() .filter callback, KF_* flags);
#   "runtime" = an explicit check in the kfunc that calls scx_error() (aborts
#   the BPF scheduler) or refuses the call. lockdep_assert_*() is debug-only
#   (CONFIG_LOCKDEP) and is listed in references with note "lockdep" but is
#   NOT counted as runtime enforcement.
# - NOTE: v7.1 no longer has current->scx.kf_mask / scx_kf_allowed(); per-op
#   context restriction is entirely verify-time (ext.c:9808-9918).
kernel_version: "v7.1"
invariants:
  - id: I1.1
    title: "DSQ insertion kfuncs (enqueue_dispatch set) are callable only from ops.select_cpu/ops.enqueue/ops.dispatch"
    description: >-
      scx_kfunc_ids_enqueue_dispatch is granted by SCX_KF_ALLOW_ENQUEUE, which
      scx_kf_allow_flags[] gives to select_cpu, enqueue and dispatch. From
      select_cpu/enqueue the call is a direct dispatch and @p must be the task
      being woken/enqueued (per-CPU direct_dispatch_task, runtime-checked in
      mark_direct_dispatch()); from dispatch it fills the per-CPU dispatch
      buffer (bounded by dispatch_max_batch, runtime-checked). Locks held by
      the caller: select_cpu -> pi_lock(p), no rq lock; enqueue ->
      rq(task_rq(p)); dispatch -> rq(this_cpu). The kfunc itself only asserts
      irqs are disabled (lockdep). In ops.dispatch it writes p->scx.slice of
      an arbitrary task (ext.c:8207-8210) without holding that task's rq lock
      - not checked.
    category: context_locking
    objects:
      - {struct: bpf_prog_aux, fields: [attach_st_ops_member_off, st_ops]}
      - {struct: "percpu", fields: [direct_dispatch_task]}
      - {struct: scx_dsp_ctx, fields: [cursor, buf]}
      - {struct: task_struct, fields: [scx.ddsp_dsq_id, scx.ddsp_enq_flags, scx.slice, scx.dsq_vtime]}
    access: write
    requires:
      contexts: [ops.select_cpu, ops.enqueue, ops.dispatch, SCX_KF_ALLOW_ENQUEUE]
      locks: [irqs_disabled, no_bpf_spin_lock]
      predicates:
        - "in ops.select_cpu/ops.enqueue: p == __this_cpu_read(direct_dispatch_task) and not already direct-dispatched"
        - "in ops.dispatch: dsp_ctx.cursor < sch->dsp_max_batch"
    applies_to: [scx_bpf_dsq_insert, scx_bpf_dsq_insert___v2, __scx_bpf_dsq_insert_vtime, scx_bpf_dsq_insert_vtime]
    enforcement_expected: static+runtime
    references:
      - {file: kernel/sched/ext.c, line: 8331, note: "BTF_KFUNCS_START(scx_kfunc_ids_enqueue_dispatch) (8331-8336)"}
      - {file: kernel/sched/ext.c, line: 9936, note: "registered for BPF_PROG_TYPE_STRUCT_OPS only"}
      - {file: kernel/sched/ext.c, line: 9829, note: "scx_kf_allow_flags[]: select_cpu, enqueue, dispatch carry SCX_KF_ALLOW_ENQUEUE (9829-9831)"}
      - {file: kernel/sched/ext.c, line: 9912, note: "scx_kfunc_context_filter(): in_enqueue && SCX_KF_ALLOW_ENQUEUE"}
      - {file: kernel/sched/ext.c, line: 3334, note: "select_task_rq_scx() sets direct_dispatch_task=p, calls ops.select_cpu with locked_rq=NULL (3339)"}
      - {file: kernel/sched/ext.c, line: 1948, note: "do_enqueue_task(): SCX_CALL_OP_TASK(enqueue, rq)"}
      - {file: kernel/sched/ext.c, line: 2840, note: "scx_dispatch_sched(): SCX_CALL_OP(dispatch, rq) (also 2844)"}
      - {file: kernel/sched/ext.c, line: 1779, note: "mark_direct_dispatch(): scx_error if p != ddsp_task (runtime)"}
      - {file: kernel/sched/ext.c, line: 8138, note: "scx_dsq_insert_commit(): scx_error 'dispatch buffer overflow' (runtime)"}
      - {file: kernel/sched/ext.c, line: 8102, note: "lockdep_assert_irqs_disabled() (lockdep)"}
      - {file: kernel/sched/ext.c, line: 8207, note: "writes p->scx.slice without asserting p's rq lock (unenforced)"}

  - id: I1.2
    title: "Dispatch-only kfuncs (dispatch set minus dsq_move*) are callable only from ops.dispatch"
    description: >-
      scx_kfunc_ids_dispatch is granted by SCX_KF_ALLOW_DISPATCH, which only
      ops.dispatch has. ops.dispatch runs from balance_one() ->
      scx_dispatch_sched() with this CPU's rq lock held (also nested via
      scx_bpf_sub_dispatch()). These kfuncs rely on the per-CPU dsp_ctx
      (cursor, rq) set up for the current dispatch round but perform no
      runtime context check; scx_bpf_dsq_move_to_local() may drop/retake rq
      locks and must not run under a BPF spin lock.
    category: context_locking
    objects:
      - {struct: scx_dsp_ctx, fields: [rq, cursor, nr_tasks]}
      - {struct: rq, fields: [scx.flags, scx.local_dsq]}
    access: rw
    requires:
      contexts: [ops.dispatch, SCX_KF_ALLOW_DISPATCH]
      locks: ["rq(this_cpu)", no_bpf_spin_lock]
    applies_to: [scx_bpf_dispatch_nr_slots, scx_bpf_dispatch_cancel, scx_bpf_dsq_move_to_local, scx_bpf_dsq_move_to_local___v2, scx_bpf_sub_dispatch]
    enforcement_expected: static
    references:
      - {file: kernel/sched/ext.c, line: 8696, note: "BTF_KFUNCS_START(scx_kfunc_ids_dispatch) (8696-8709); scx_bpf_sub_dispatch only with CONFIG_EXT_SUB_SCHED"}
      - {file: kernel/sched/ext.c, line: 9938, note: "registered for BPF_PROG_TYPE_STRUCT_OPS only"}
      - {file: kernel/sched/ext.c, line: 9831, note: "only ops.dispatch has SCX_KF_ALLOW_DISPATCH"}
      - {file: kernel/sched/ext.c, line: 9910, note: "filter check"}
      - {file: kernel/sched/ext.c, line: 2890, note: "balance_one(): lockdep_assert_rq_held + sets SCX_RQ_IN_BALANCE before dispatch"}
      - {file: kernel/sched/ext.c, line: 8689, note: "scx_bpf_sub_dispatch() re-enters scx_dispatch_sched() on this_rq"}
      - {file: kernel/sched/ext.c, line: 8484, note: "dispatch_cancel: scx_error on underflow (state check, not a context check)"}
      - {file: kernel/sched/ext.c, line: 8530, note: "move_to_local uses dspc->rq; no runtime check that we are inside ops.dispatch"}

  - id: I1.3
    title: "DSQ-iterator move kfuncs are callable from ops.dispatch or rq-unlocked contexts (UNLOCKED ops, SYSCALL)"
    description: >-
      scx_bpf_dsq_move* are members of both the dispatch and unlocked sets, so
      the filter allows them from ops.dispatch (rq(this_cpu) held) and from
      every SCX_KF_ALLOW_UNLOCKED op and SYSCALL programs (no rq lock held).
      scx_dsq_move() distinguishes the two cases at runtime with
      this_rq->scx.flags & SCX_RQ_IN_BALANCE (not with scx_locked_rq()): in
      balance it may unlock this_rq and lock task_rq(p); otherwise it locks
      task_rq(p) itself, then dsq->lock. Correctness depends on the static
      rule that the only rq-locked caller is ops.dispatch.
    category: context_locking
    objects:
      - {struct: bpf_iter_scx_dsq_kern, fields: [dsq, cursor.flags, slice, vtime]}
      - {struct: rq, fields: [scx.flags]}
      - {struct: task_struct, fields: [scx.slice, scx.dsq_vtime]}
    access: write
    requires:
      contexts: [ops.dispatch, "UNLOCKED ops (init_task, dump, cgroup_init, cgroup_exit, cgroup_prep_move, cgroup_cancel_move, cgroup_set_weight, cgroup_set_bandwidth, cgroup_set_idle, sub_attach, sub_detach, cpu_online, cpu_offline, init, exit)", "prog:SYSCALL", SCX_KF_ALLOW_DISPATCH, SCX_KF_ALLOW_UNLOCKED]
      locks: ["rq(this_cpu) iff SCX_RQ_IN_BALANCE else none", no_bpf_spin_lock]
    applies_to: [scx_bpf_dsq_move_set_slice, scx_bpf_dsq_move_set_vtime, scx_bpf_dsq_move, scx_bpf_dsq_move_vtime]
    enforcement_expected: static
    references:
      - {file: kernel/sched/ext.c, line: 8701, note: "dispatch set membership (8702-8705)"}
      - {file: kernel/sched/ext.c, line: 8816, note: "unlocked set membership (8817-8820)"}
      - {file: kernel/sched/ext.c, line: 9944, note: "unlocked set also registered for BPF_PROG_TYPE_SYSCALL"}
      - {file: kernel/sched/ext.c, line: 9878, note: "SYSCALL progs: unlocked/select_cpu/idle/any allowed"}
      - {file: kernel/sched/ext.c, line: 8389, note: "in_balance = this_rq->scx.flags & SCX_RQ_IN_BALANCE decides lock dance (8389-8398)"}
      - {file: kernel/sched/ext.c, line: 8615, note: "doc: 'ops.dispatch() or any BPF context which doesn't hold a rq lock'"}

  - id: I1.4
    title: "scx_bpf_reenqueue_local (legacy) is callable only from ops.cpu_release"
    description: >-
      The cpu_release set contains only the legacy scx_bpf_reenqueue_local();
      SCX_KF_ALLOW_CPU_RELEASE is given only to ops.cpu_release, which is
      called from switch_class() with the local rq lock held. The kfunc
      assumes the rq of smp_processor_id() is locked (lockdep only). The
      ___v2 replacement is in the `any` set (I1.8) and defers the work.
    category: context_locking
    objects:
      - {struct: rq, fields: [scx.local_dsq]}
    access: rw
    requires:
      contexts: [ops.cpu_release, SCX_KF_ALLOW_CPU_RELEASE]
      locks: ["rq(this_cpu)"]
    applies_to: [scx_bpf_reenqueue_local]
    enforcement_expected: static
    references:
      - {file: kernel/sched/ext.c, line: 8745, note: "BTF_KFUNCS_START(scx_kfunc_ids_cpu_release)"}
      - {file: kernel/sched/ext.c, line: 9832, note: "only ops.cpu_release has SCX_KF_ALLOW_CPU_RELEASE"}
      - {file: kernel/sched/ext.c, line: 3054, note: "switch_class(): SCX_CALL_OP(cpu_release, rq)"}
      - {file: kernel/sched/ext.c, line: 8738, note: "lockdep_assert_rq_held(this cpu rq) (lockdep)"}

  - id: I1.5
    title: "scx_bpf_create_dsq is callable only from sleepable UNLOCKED ops or SYSCALL programs"
    description: >-
      Member of the unlocked set with KF_SLEEPABLE. Filter restricts it to
      SCX_KF_ALLOW_UNLOCKED ops and SYSCALL progs; the verifier additionally
      requires a sleepable program, and bpf_scx_check_member() only allows
      sleepable programs on init_task, cgroup_init, cgroup_exit,
      cgroup_prep_move, cpu_online, cpu_offline, init, exit, sub_attach,
      sub_detach. So although dump/cgroup_cancel_move/cgroup_set_* are
      UNLOCKED ops, create_dsq is effectively unusable there. Allocates with
      GFP_KERNEL.
    category: context_locking
    objects:
      - {struct: scx_sched, fields: [dsq_hash]}
    access: write
    requires:
      contexts: [ops.init_task, ops.cgroup_init, ops.cgroup_exit, ops.cgroup_prep_move, ops.cpu_online, ops.cpu_offline, ops.init, ops.exit, ops.sub_attach, ops.sub_detach, "prog:SYSCALL", SCX_KF_ALLOW_UNLOCKED]
      locks: [none]
      predicates: ["prog->sleepable"]
    applies_to: [scx_bpf_create_dsq]
    enforcement_expected: static
    references:
      - {file: kernel/sched/ext.c, line: 8815, note: "KF_IMPLICIT_ARGS | KF_SLEEPABLE in scx_kfunc_ids_unlocked"}
      - {file: kernel/sched/ext.c, line: 9906, note: "filter: SCX_KF_ALLOW_UNLOCKED && in_unlocked"}
      - {file: kernel/sched/ext.c, line: 7609, note: "bpf_scx_check_member(): sleepable only for listed ops (7615-7631)"}
      - {file: kernel/bpf/verifier.c, line: 13053, note: "'program must be sleepable to call sleepable kfunc'"}
      - {file: kernel/sched/ext.c, line: 8779, note: "kmalloc_node(GFP_KERNEL)"}

  - id: I1.6
    title: "select_cpu kfuncs are callable from ops.select_cpu/ops.enqueue (on the subject task) or rq-unlocked contexts"
    description: >-
      Members of scx_kfunc_ids_select_cpu (ext_idle.c) and of the unlocked set.
      Allowed in ops.select_cpu and ops.enqueue (SCX_KF_ALLOW_SELECT_CPU), all
      UNLOCKED ops and SYSCALL programs; kept out of TRACING because they may
      take p->pi_lock. Runtime, select_cpu_from_kfunc() requires the lock
      protecting p->cpus_ptr: inside ops.select_cpu p must be kf_tasks[0]
      (pi_lock held by try_to_wake_up); inside another rq-locked op
      task_rq(p) must equal scx_locked_rq() (else scx_error "cross-task");
      otherwise it takes pi_lock itself.
    category: context_locking
    objects:
      - {struct: task_struct, fields: [scx.kf_tasks, cpus_ptr, nr_cpus_allowed, pi_lock]}
      - {struct: rq, fields: [scx.in_select_cpu]}
      - {struct: "percpu", fields: [scx_locked_rq_state]}
    access: read
    requires:
      contexts: [ops.select_cpu, ops.enqueue, "UNLOCKED ops", "prog:SYSCALL", SCX_KF_ALLOW_SELECT_CPU, SCX_KF_ALLOW_UNLOCKED]
      locks: ["pi_lock(p) (ops.select_cpu)", "rq(task_rq(p)) (ops.enqueue)", "none -> takes pi_lock(p) (unlocked)"]
      predicates:
        - "this_rq()->scx.in_select_cpu => p in current->scx.kf_tasks[]"
        - "scx_locked_rq() != NULL => task_rq(p) == scx_locked_rq()"
    applies_to: [__scx_bpf_select_cpu_and, scx_bpf_select_cpu_and, scx_bpf_select_cpu_dfl]
    enforcement_expected: static+runtime
    references:
      - {file: kernel/sched/ext_idle.c, line: 1499, note: "BTF_KFUNCS_START(scx_kfunc_ids_select_cpu); comment 1487-1497 on keeping out of TRACING"}
      - {file: kernel/sched/ext.c, line: 8821, note: "also in scx_kfunc_ids_unlocked (8822-8824)"}
      - {file: kernel/sched/ext_idle.c, line: 1518, note: "registered for STRUCT_OPS and SYSCALL only"}
      - {file: kernel/sched/ext.c, line: 9829, note: "select_cpu and enqueue carry SCX_KF_ALLOW_SELECT_CPU"}
      - {file: kernel/sched/ext.c, line: 3338, note: "in_select_cpu=true around ops.select_cpu"}
      - {file: kernel/sched/ext_idle.c, line: 940, note: "scx_kf_arg_task_ok() + lockdep_assert_held(pi_lock) (940-943)"}
      - {file: kernel/sched/ext_idle.c, line: 944, note: "task_rq(p) != scx_locked_rq() -> cross_task scx_error (974-977)"}
      - {file: kernel/sched/ext_idle.c, line: 948, note: "unlocked: raw_spin_lock_irqsave(&p->pi_lock)"}
      - {file: kernel/sched/ext.c, line: 549, note: "scx_kf_arg_task_ok(): scx_error 'called on a task not being operated on'"}

  - id: I1.7
    title: "Idle-tracking kfuncs are context-insensitive: callable from any SCX op, SYSCALL and TRACING programs"
    description: >-
      scx_kfunc_ids_idle is registered for STRUCT_OPS, TRACING and SYSCALL; the
      filter allows it from every sched_ext op (in_idle short-circuit) and any
      non-struct_ops prog type it is registered for. No lock is required;
      the cpumask helpers return refcounted (KF_ACQUIRE/KF_RELEASE) kptrs
      checked by the verifier. Rejected only in non-SCX struct_ops.
    category: context_locking
    objects:
      - {struct: scx_idle_cpus, fields: [cpu, smt]}
    access: rw
    requires:
      contexts: ["any ops.*", "prog:TRACING", "prog:SYSCALL"]
      locks: [none]
    applies_to: [scx_bpf_cpu_node, scx_bpf_get_idle_cpumask_node, scx_bpf_get_idle_cpumask, scx_bpf_get_idle_smtmask_node, scx_bpf_get_idle_smtmask, scx_bpf_put_idle_cpumask, scx_bpf_test_and_clear_cpu_idle, scx_bpf_pick_idle_cpu_node, scx_bpf_pick_idle_cpu, scx_bpf_pick_any_cpu_node, scx_bpf_pick_any_cpu]
    enforcement_expected: static
    references:
      - {file: kernel/sched/ext_idle.c, line: 1468, note: "BTF_KFUNCS_START(scx_kfunc_ids_idle) (1468-1480)"}
      - {file: kernel/sched/ext_idle.c, line: 1515, note: "registered for STRUCT_OPS, TRACING, SYSCALL (1515-1517)"}
      - {file: kernel/sched/ext.c, line: 9900, note: "filter: in_any || in_idle -> allowed for every SCX op"}

  - id: I1.8
    title: "Generic `any`-set kfuncs are callable from any SCX op, SYSCALL and TRACING programs without lock requirements"
    description: >-
      scx_kfunc_ids_any is registered for STRUCT_OPS, TRACING and SYSCALL and
      bypasses the per-op allow table. These kfuncs either take their own
      locks (dsq->lock, rq trylock, deferred_reenq_lock), are lockless/RCU
      (dsq_peek, cpu_curr: KF_RCU_PROTECTED) or defer work (kick_cpu via
      irq_work, dsq_reenq). No caller-held lock is required and none is
      checked. scx_bpf_cpu_rq is deprecated because it hands out an rq
      pointer without the rq lock.
    category: context_locking
    objects:
      - {struct: rq, fields: [scx.cpus_to_kick, scx.local_dsq.nr, curr]}
      - {struct: scx_dispatch_q, fields: [lock, first_task, nr]}
    access: rw
    requires:
      contexts: ["any ops.*", "prog:TRACING", "prog:SYSCALL"]
      locks: [none]
    applies_to: [scx_bpf_kick_cpu, scx_bpf_dsq_nr_queued, scx_bpf_destroy_dsq, scx_bpf_dsq_peek, scx_bpf_dsq_reenq, scx_bpf_reenqueue_local___v2, bpf_iter_scx_dsq_new, bpf_iter_scx_dsq_next, bpf_iter_scx_dsq_destroy, scx_bpf_exit_bstr, scx_bpf_error_bstr, scx_bpf_cpuperf_cap, scx_bpf_cpuperf_cur, scx_bpf_nr_node_ids, scx_bpf_nr_cpu_ids, scx_bpf_get_possible_cpumask, scx_bpf_get_online_cpumask, scx_bpf_put_cpumask, scx_bpf_task_running, scx_bpf_task_cpu, scx_bpf_cpu_rq, scx_bpf_cpu_curr, scx_bpf_now, scx_bpf_events]
    enforcement_expected: static
    references:
      - {file: kernel/sched/ext.c, line: 9767, note: "BTF_KFUNCS_START(scx_kfunc_ids_any) (9767-9800)"}
      - {file: kernel/sched/ext.c, line: 9946, note: "registered for STRUCT_OPS, TRACING, SYSCALL (9946-9951)"}
      - {file: kernel/sched/ext.c, line: 9881, note: "non-struct_ops progs: only any/idle"}
      - {file: kernel/sched/ext.c, line: 8902, note: "scx_kick_cpu(): actual kick bounced to irq_work to avoid nesting rq locks"}
      - {file: kernel/sched/ext.c, line: 9156, note: "scx_bpf_dsq_reenq: 'Can be called from anywhere' (asynchronous)"}
      - {file: kernel/sched/ext.c, line: 9552, note: "scx_bpf_cpu_rq deprecated: unlocked rq pointer"}

  - id: I1.9
    title: "rq-lock-aware `any` kfuncs: scx_bpf_locked_rq requires a held rq; scx_bpf_cpuperf_set must target the held rq"
    description: >-
      Both read scx_locked_rq() (per-CPU scx_locked_rq_state, maintained by
      SCX_CALL_OP* from the locked_rq argument). scx_bpf_locked_rq()
      scx_error()s if no rq is locked. scx_bpf_cpuperf_set() scx_error()s if
      an rq is locked and the target CPU's rq differs (ABBA prevention), and
      otherwise takes the target rq lock itself. Gap: scx_locked_rq_state is
      only set by SCX_CALL_OP*; a TRACING program (allowed: `any` set) that
      runs while the core scheduler holds an rq lock outside an SCX op sees
      NULL and would rq_lock_irqsave() a possibly already-held rq.
    category: context_locking
    objects:
      - {struct: "percpu", fields: [scx_locked_rq_state]}
      - {struct: rq, fields: [scx.cpuperf_target]}
    access: rw
    requires:
      contexts: ["any ops.*", "prog:TRACING", "prog:SYSCALL"]
      locks: ["scx_locked_rq() != NULL (locked_rq)", "scx_locked_rq() == NULL || scx_locked_rq() == cpu_rq(cpu) (cpuperf_set)"]
    applies_to: [scx_bpf_locked_rq, scx_bpf_cpuperf_set]
    enforcement_expected: runtime
    references:
      - {file: kernel/sched/ext.c, line: 456, note: "DEFINE_PER_CPU scx_locked_rq_state"}
      - {file: kernel/sched/ext.c, line: 465, note: "update_locked_rq(): lockdep_assert_rq_held (lockdep)"}
      - {file: kernel/sched/ext.c, line: 474, note: "SCX_CALL_OP saves/restores locked rq around the op"}
      - {file: kernel/sched/ext.c, line: 9581, note: "scx_bpf_locked_rq: scx_error 'accessing rq without holding rq lock'"}
      - {file: kernel/sched/ext.c, line: 9444, note: "cpuperf_set: scx_error 'Invalid target CPU' if rq != locked_rq"}
      - {file: kernel/sched/ext.c, line: 9453, note: "cpuperf_set: rq_lock_irqsave when no rq tracked as locked"}

  - id: I1.10
    title: "scx_bpf_dump_bstr is callable only during ops.dump/dump_cpu/dump_task"
    description: >-
      Statically in the `any` set; the restriction is a runtime check that the
      calling CPU is the one currently running scx_dump_state()
      (scx_dump_data.cpu). The dump ops run with scx_dump_lock (raw spinlock,
      irqs off) held, from irq_work or SysRq; dump_cpu/dump_task additionally
      hold the dumped CPU's rq lock.
    category: context_locking
    objects:
      - {struct: scx_dump_data, fields: [cpu, cursor, buf]}
    access: write
    requires:
      contexts: [ops.dump, ops.dump_cpu, ops.dump_task]
      locks: ["scx_dump_lock", "rq(cpu) (dump_cpu, dump_task)"]
      predicates: ["raw_smp_processor_id() == scx_dump_data.cpu"]
    applies_to: [scx_bpf_dump_bstr]
    enforcement_expected: runtime
    references:
      - {file: kernel/sched/ext.c, line: 9324, note: "scx_error 'must only be called from ops.dump() and friends'"}
      - {file: kernel/sched/ext.c, line: 6337, note: "scx_dump_state(): guard(raw_spinlock_irqsave)(&scx_dump_lock)"}
      - {file: kernel/sched/ext.c, line: 6381, note: "rq_lock_irqsave before ops.dump_cpu/dump_task"}

  - id: I1.11
    title: "scx_bpf_task_cgroup may only be called on a task the current op operates on"
    description: >-
      @p must be current->scx.kf_tasks[0] or [1], i.e. the task argument of an
      op invoked via SCX_CALL_OP_TASK*() (which holds p's rq lock or, for
      select_cpu, p's pi_lock), so that p->sched_task_group is stable.
      Otherwise scx_error() and the root cgroup is returned.
    category: context_locking
    objects:
      - {struct: task_struct, fields: [scx.kf_tasks, sched_task_group]}
    access: read
    requires:
      contexts: [ops.select_cpu, ops.enqueue, ops.dequeue, ops.runnable, ops.running, ops.stopping, ops.quiescent, ops.yield, ops.core_sched_before, ops.set_weight, ops.set_cpumask, ops.tick, ops.enable, ops.disable, ops.exit_task, ops.cgroup_move]
      locks: ["rq(task_rq(p)) | pi_lock(p)"]
      predicates: ["p == current->scx.kf_tasks[0] || p == current->scx.kf_tasks[1]"]
    applies_to: [scx_bpf_task_cgroup]
    enforcement_expected: runtime
    references:
      - {file: kernel/sched/ext.c, line: 9798, note: "any set, CONFIG_CGROUP_SCHED only"}
      - {file: kernel/sched/ext.c, line: 9754, note: "scx_kf_arg_task_ok()"}
      - {file: kernel/sched/ext.c, line: 503, note: "SCX_CALL_OP_TASK*: kf_tasks[] protocol and lock guarantee (503-546)"}

  - id: I1.12
    title: "scx_bpf_task_set_slice / scx_bpf_task_set_dsq_vtime write task scheduling fields from any context without a lock"
    description: >-
      In the `any` set (so also TRACING/SYSCALL). They only check that the
      calling scheduler owns @p (scx_task_on_sched) and then store
      p->scx.slice / p->scx.dsq_vtime with no rq/dsq lock and no context
      check. Unenforced: concurrent with the core (e.g. slice refill in
      tick/dispatch) or with DSQ vtime ordering.
    category: context_locking
    objects:
      - {struct: task_struct, fields: [scx.slice, scx.dsq_vtime]}
    access: write
    requires:
      contexts: ["any ops.*", "prog:TRACING", "prog:SYSCALL"]
      locks: [none]
      predicates: ["scx_task_on_sched(sch, p)"]
    applies_to: [scx_bpf_task_set_slice, scx_bpf_task_set_dsq_vtime]
    enforcement_expected: none
    references:
      - {file: kernel/sched/ext.c, line: 8851, note: "only ownership check, then p->scx.slice = slice"}
      - {file: kernel/sched/ext.c, line: 8874, note: "only ownership check, then p->scx.dsq_vtime = vtime"}

  - id: I1.13
    title: "No sched_ext kfunc may be called while the BPF program holds a bpf_spin_lock"
    description: >-
      The verifier rejects any call except spin_unlock/kptr_xchg and
      kfunc_spin_allowed() kfuncs while env->cur_state->active_locks is set.
      None of the SCX kfuncs is spin-allowed. This is what
      sched-ext.rst means by "cannot be called with any BPF locks held".
    category: context_locking
    objects:
      - {struct: bpf_verifier_state, fields: [active_locks]}
    access: read
    requires:
      locks: [no_bpf_spin_lock]
    applies_to: ["*"]
    enforcement_expected: static
    references:
      - {file: kernel/bpf/verifier.c, line: 17626, note: "'function calls are not allowed while holding a lock'"}
      - {file: Documentation/scheduler/sched-ext.rst, line: 373, note: "dsq_insert/move_to_local and BPF locks"}

  - id: I1.14
    title: "Program-type gate: SCX kfuncs are denied to non-SCX struct_ops; TRACING gets only any+idle; SYSCALL gets unlocked+select_cpu+idle+any"
    description: >-
      Applies to every SCX kfunc. Enforced by which hooks each set is
      registered for and by scx_kfunc_context_filter(), invoked from
      btf_kfunc_is_allowed() during verification. While st_ops is not yet
      known (early kfunc collection) everything is allowed and the filter is
      re-run in do_check_main().
    category: context_locking
    objects:
      - {struct: bpf_prog, fields: [type, aux.st_ops, aux.attach_st_ops_member_off, sleepable]}
    access: read
    requires:
      contexts: ["prog:STRUCT_OPS(sched_ext_ops)", "prog:SYSCALL", "prog:TRACING"]
    applies_to: ["*"]
    enforcement_expected: static
    references:
      - {file: kernel/sched/ext.c, line: 9860, note: "scx_kfunc_context_filter() (9860-9918)"}
      - {file: kernel/sched/ext.c, line: 9877, note: "SYSCALL rule"}
      - {file: kernel/sched/ext.c, line: 9880, note: "TRACING (non-struct_ops) rule"}
      - {file: kernel/sched/ext.c, line: 9890, note: "st_ops not set yet -> allow, re-checked later"}
      - {file: kernel/sched/ext.c, line: 9896, note: "non-SCX struct_ops -> -EACCES"}
      - {file: kernel/bpf/btf.c, line: 8864, note: "__btf_kfunc_is_allowed(): any filter returning non-zero denies"}
      - {file: kernel/bpf/verifier.c, line: 12612, note: "btf_kfunc_is_allowed() check at kfunc lookup"}
