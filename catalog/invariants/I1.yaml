      - id: I1.ops_state.atomic
        title: "p->scx.ops_state is written only with atomics: QUEUEING under the task's rq lock, exits with release, claims with cmpxchg"
        description: >-
          ops_state hands a task between the SCX core and the BPF scheduler. It is
          never written with a plain store. QUEUEING is entered (and left) under
          the task's rq lock; leaving QUEUEING or DISPATCHING uses
          atomic_long_set_release() to pair with waiters' load_acquire; claims
          (QUEUED -> DISPATCHING in finish_dispatch, QUEUED -> NONE in
          ops_dequeue) use atomic_long_try_cmpxchg(). The legal transitions
          themselves are I2 (ownership); this rule records the write discipline
          on the kfunc paths (scx_bpf_dsq_move_to_local -> flush_dispatch_buf ->
          finish_dispatch / dispatch_enqueue / dispatch_to_local_dsq).
        category: context_locking
        status: source_verified
        role: protection
        objects:
          - {struct: task_struct, fields: [scx.ops_state]}
        access: write
        requires:
          locks:
            - {lock: bpf_spin_lock, state: not_held, where: access_site}
        obligations:
          - id: queueing_entry
            access: {struct: task_struct, fields: [scx.ops_state], op: atomic, instance: p}
            sites:
              - {function: do_enqueue_task, file: kernel/sched/ext.c, line: 1942}
            requires:
              locks:
                - {lock: rq, instance: rq, state: held, note: "do_enqueue_task(rq, p, ...) is called with p's rq (enqueue_task_scx 2061)"}
            basis: documented
            evidence:
              - {kind: kernel_comment, file: kernel/sched/ext_internal.h, line: 1276, end_line: 1280, note: "QUEUEING: the task's rq lock is held during this state"}
              - {kind: kernel_comment, file: kernel/sched/ext.c, line: 2089, end_line: 2093, symbol: ops_dequeue, note: "QUEUEING started and finished under p's rq lock; BUG() if seen"}
          - id: exit_release
            access: {struct: task_struct, fields: [scx.ops_state], op: atomic, ordering: release, instance: p}
            sites:
              - {function: dispatch_enqueue, file: kernel/sched/ext.c, line: 1643}
              - {function: direct_dispatch, file: kernel/sched/ext.c, line: 1849}
              - {function: direct_dispatch, file: kernel/sched/ext.c, line: 1854}
              - {function: do_enqueue_task, file: kernel/sched/ext.c, line: 1964}
              - {function: dispatch_to_local_dsq, file: kernel/sched/ext.c, line: 2622}
            basis: documented
            evidence:
              - {kind: kernel_comment, file: kernel/sched/ext_internal.h, line: 1303, end_line: 1306, note: "transitions out of QUEUEING / DISPATCHING must use atomic_long_set_release()"}
              - {kind: kernel_comment, file: kernel/sched/ext.c, line: 1638, end_line: 1640, symbol: dispatch_enqueue}
              - {kind: kernel_comment, file: kernel/sched/ext.c, line: 2621, symbol: dispatch_to_local_dsq}
          - id: claim_cmpxchg
            access: {struct: task_struct, fields: [scx.ops_state], op: atomic, ordering: full, instance: p}
            sites:
              - {function: finish_dispatch, file: kernel/sched/ext.c, line: 2724, end_line: 2725}
              - {function: ops_dequeue, file: kernel/sched/ext.c, line: 2109, end_line: 2110}
            requires:
              predicates:
                - expr: "(opss & SCX_OPSS_QSEQ_MASK) == qseq_at_dispatch"
                  captures:
                    - {var: qseq_at_dispatch, expr: "atomic_long_read(&p->scx.ops_state) & SCX_OPSS_QSEQ_MASK", function: scx_dsq_insert_commit, file: kernel/sched/ext.c, line: 8145, note: "recorded in the dispatch buffer entry"}
                  evaluated_at: {function: finish_dispatch, file: kernel/sched/ext.c, line: 2708}
                  checked_by: [finish_dispatch]
                  on_failure: return
                  note: "finish_dispatch only; stale request after dequeue/re-enqueue is dropped (2709)"
            basis: documented
            evidence:
              - {kind: kernel_comment, file: kernel/sched/ext.c, line: 2717, end_line: 2723, symbol: finish_dispatch, note: "claim @p by atomically transitioning it from QUEUED to DISPATCHING"}
              - {kind: runtime_check, file: kernel/sched/ext.c, line: 2708, end_line: 2709, symbol: finish_dispatch}
            paths:
              - root: scx_bpf_dsq_move_to_local___v2
                steps:
                  - {function: scx_bpf_dsq_move_to_local___v2, file: kernel/sched/ext.c, line: 8530, call: "flush_dispatch_buf(sch, dspc->rq)", held: [{lock: rq, instance: dspc->rq}]}
                  - {function: flush_dispatch_buf, file: kernel/sched/ext.c, line: 2757, call: "finish_dispatch(sch, rq, ent->task, ent->qseq, ent->dsq_id, ent->enq_flags)", held: [{lock: rq, instance: rq}]}
                  - {function: finish_dispatch, file: kernel/sched/ext.c, line: 2724, held: [{lock: rq, instance: rq}], note: "rq is the dispatching CPU's rq, not necessarily task_rq(p); ownership comes from the cmpxchg"}
        applies_to: [scx_bpf_dsq_move_to_local, scx_bpf_dsq_move_to_local___v2]
        enforcement:
          expected: runtime
          mechanisms: [atomic, lock, warn]
          sites:
            - {file: kernel/sched/ext.c, line: 1941, end_line: 1942, symbol: do_enqueue_task, note: "WARN unless NONE, then set QUEUEING"}
            - {file: kernel/sched/ext.c, line: 2724, end_line: 2725, symbol: finish_dispatch}
            - {file: kernel/sched/ext.c, line: 2109, end_line: 2110, symbol: ops_dequeue}
        references:
          - {file: kernel/sched/ext_internal.h, line: 1239, end_line: 1310, note: "ops_state protocol and memory ordering"}
          - {file: include/linux/sched/ext.h, line: 189, note: "atomic_long_t ops_state"}

      - id: I1.dsq_insert.commit_guards
        title: "scx_bpf_dsq_insert*: direct-dispatch writes need p == the captured ddsp_task; dispatch-buffer writes need a free slot"
        description: >-
          scx_dsq_insert_commit() captures ddsp_task = direct_dispatch_task once
          (8132). Direct path (ddsp_task != NULL, ops.select_cpu / ops.enqueue):
          mark_direct_dispatch() first overwrites the live per-CPU variable with
          ERR_PTR(-ESRCH) (1776) and then compares p against the captured
          ddsp_task (1779); only if they match does it write p->scx.ddsp_dsq_id /
          ddsp_enq_flags (1793-1794), otherwise scx_error() and an explicit
          return (1787). A fresh read of direct_dispatch_task at that point is not
          the snapshot. Buffered path (ddsp_task == NULL, ops.dispatch): the
          dispatch-buffer slot dspc->buf[cursor] and dspc->cursor are written only
          if cursor < dsp_max_batch (8138-8140, explicit return). Both checks come
          after the p->scx.slice / dsq_vtime writes (8207-8210, 8234-8238), see
          I1.task_slice_vtime.unlocked_writers.
        category: context_locking
        status: source_verified
        role: protection
        objects:
          - {struct: task_struct, fields: [scx.ddsp_dsq_id, scx.ddsp_enq_flags]}
          - {struct: scx_dsp_ctx, fields: [buf, cursor]}
        access: write
        requires:
          locks:
            - {lock: irqs_disabled, state: held, where: access_site, note: "lockdep_assert_irqs_disabled() in scx_dsq_insert_preamble() (8102); context condition"}
        obligations:
          - id: direct
            access: {struct: task_struct, fields: [scx.ddsp_dsq_id, scx.ddsp_enq_flags], op: write, instance: p}
            sites:
              - {function: mark_direct_dispatch, file: kernel/sched/ext.c, line: 1793, end_line: 1794}
            when: "ddsp_task != NULL"
            requires:
              predicates:
                - expr: "p == ddsp_task"
                  captures:
                    - {var: ddsp_task, expr: "__this_cpu_read(direct_dispatch_task)", function: scx_dsq_insert_commit, file: kernel/sched/ext.c, line: 8132, note: "passed to mark_direct_dispatch() at 8134; the per-CPU variable is overwritten at 1776 before the compare"}
                  evaluated_at: {function: mark_direct_dispatch, file: kernel/sched/ext.c, line: 1779}
                  checked_by: [mark_direct_dispatch]
                  on_failure: return
                  note: "scx_error at 1781/1784, explicit return at 1787; IS_ERR(ddsp_task) = already direct-dispatched"
            basis: checked
            evidence:
              - {kind: runtime_check, file: kernel/sched/ext.c, line: 1779, end_line: 1787, symbol: mark_direct_dispatch}
              - {kind: runtime_check, file: kernel/sched/ext.c, line: 1790, end_line: 1791, symbol: mark_direct_dispatch, note: "WARN_ON_ONCE unless the fields are still clear"}
          - id: buffered
            access: {struct: scx_dsp_ctx, fields: [buf, cursor], op: write, instance: dspc}
            sites:
              - {function: scx_dsq_insert_commit, file: kernel/sched/ext.c, line: 8143, end_line: 8148}
            when: "ddsp_task == NULL"
            requires:
              predicates:
                - expr: "dspc->cursor < sch->dsp_max_batch"
                  evaluated_at: {function: scx_dsq_insert_commit, file: kernel/sched/ext.c, line: 8138}
                  checked_by: [scx_dsq_insert_commit]
                  on_failure: return
                  note: "scx_error('dispatch buffer overflow') 8139, return 8140"
            basis: checked
            evidence:
              - {kind: runtime_check, file: kernel/sched/ext.c, line: 8138, end_line: 8140, symbol: scx_dsq_insert_commit}
            note: "dspc is this CPU's sch->pcpu->dsp_ctx (8129); it is per-CPU, so no lock is involved."
        applies_to: [scx_bpf_dsq_insert, scx_bpf_dsq_insert___v2, __scx_bpf_dsq_insert_vtime, scx_bpf_dsq_insert_vtime]
        enforcement:
          expected: runtime
          mechanisms: [guard, scx_error, warn, lockdep]
          sites:
            - {file: kernel/sched/ext.c, line: 1779, end_line: 1787, symbol: mark_direct_dispatch}
            - {file: kernel/sched/ext.c, line: 8138, end_line: 8140, symbol: scx_dsq_insert_commit}
        references:
          - {file: kernel/sched/ext.c, line: 8126, end_line: 8149, symbol: scx_dsq_insert_commit}
          - {file: kernel/sched/ext.c, line: 1766, end_line: 1795, symbol: mark_direct_dispatch}
          - {file: kernel/sched/ext.c, line: 1944, end_line: 1950, symbol: do_enqueue_task, note: "direct_dispatch_task = p around ops.enqueue"}
          - {file: kernel/sched/ext.c, line: 118, note: "direct_dispatch_task is a plain per-CPU variable"}

      - id: I1.dsq_move.slice_vtime
        title: "scx_bpf_dsq_move* write the moved task's slice / dsq_vtime with its rq lock and the source DSQ lock held"
        description: >-
          scx_dsq_move() locks task_rq(p) (from ops.dispatch by switching from
          this_rq, otherwise directly) and then src_dsq->lock, re-checks that p is
          still on src_dsq (nldsq_cursor_lost_task(), which asserts both locks),
          and only then applies the iterator's vtime / slice to p while p is still
          queued, before moving it. The kernel comment states this is safe because
          the DSQ is locked.
        category: context_locking
        status: source_verified
        role: protection
        objects:
          - {struct: task_struct, fields: [scx.slice, scx.dsq_vtime]}
        access: write
        requires:
          locks:
            - {lock: bpf_spin_lock, state: not_held, where: access_site}
        obligations:
          - id: move_update
            access: {struct: task_struct, fields: [scx.slice, scx.dsq_vtime], op: write, instance: p}
            sites:
              - {function: scx_dsq_move, file: kernel/sched/ext.c, line: 8417, end_line: 8420}
            requires:
              locks:
                - {lock: rq, instance: src_rq, state: held, note: "src_rq = task_rq(p) (8385)"}
                - {lock: dsq, instance: src_dsq, state: held}
            basis: checked
            evidence:
              - {kind: kernel_comment, file: kernel/sched/ext.c, line: 8412, end_line: 8415, symbol: scx_dsq_move, note: "@p is still on $src_dsq but this is safe as we're locking it"}
              - {kind: acquired_on_path, file: kernel/sched/ext.c, line: 8391, end_line: 8401, symbol: scx_dsq_move, note: "lock src_rq (8394 or 8397), then src_dsq->lock (8401)"}
              - {kind: lockdep_assert, file: kernel/sched/ext.c, line: 677, end_line: 678, symbol: nldsq_cursor_lost_task, note: "nldsq_cursor_lost_task(&kit->cursor, src_rq, src_dsq, p) is called unconditionally at 8404, before the writes; it asserts src_rq (677) and src_dsq->lock (678)"}
            paths:
              - root: scx_bpf_dsq_move
                steps:
                  - {function: scx_dsq_move, file: kernel/sched/ext.c, line: 8420, held: [{lock: rq, instance: src_rq}, {lock: dsq, instance: src_dsq}]}
        applies_to: [scx_bpf_dsq_move, scx_bpf_dsq_move_vtime]
        enforcement:
          expected: runtime
          mechanisms: [lock, lockdep]
          sites:
            - {file: kernel/sched/ext.c, line: 8391, end_line: 8401, symbol: scx_dsq_move}
        references:
          - {file: kernel/sched/ext.c, line: 8344, end_line: 8438, symbol: scx_dsq_move}
        notes: "Correctness of the lock dance depends on SCX_RQ_IN_BALANCE (8389) meaning 'this_rq is held', i.e. on the static rule that ops.dispatch is the only rq-locked caller (I1.dsq_move.context)."

      - id: I1.task_slice_vtime.unlocked_writers
        title: "Draft: should BPF-initiated writes of p->scx.slice / dsq_vtime hold task_rq(p)?"
        description: >-
          Hypothesis, not established by the source. scx_bpf_task_set_slice() /
          scx_bpf_task_set_dsq_vtime() (any set, so also TRACING / SYSCALL) store
          the fields with only RCU and a scheduler-authority check
          (scx_task_on_sched), no rq / DSQ lock and no context check (8844-8878).
          scx_bpf_dsq_insert*() store them before the commit checks, under
          whatever lock the calling callback holds (8207-8210, 8233-8238). The core
          updates slice under the rq lock (update_curr_scx 1348) and the
          dsq_move path under task_rq + DSQ lock (I1.dsq_move.slice_vtime). The
          kernel declares both fields "BPF scheduler modifiable" and only warns
          that changing dsq_vtime while queued may mangle the ordering
          (include/linux/sched/ext.h:210-231). This neither demonstrates a race
          nor shows that synchronization is unnecessary; it needs a test.
        category: context_locking
        status: draft
        role: protection
        objects:
          - {struct: task_struct, fields: [scx.slice, scx.dsq_vtime]}
        access: write
        requires:
          locks:
            - {lock: bpf_spin_lock, state: not_held, where: access_site}
        obligations:
          - id: task_set
            access: {struct: task_struct, fields: [scx.slice, scx.dsq_vtime], op: write, instance: p}
            sites:
              - {function: scx_bpf_task_set_slice, file: kernel/sched/ext.c, line: 8854}
              - {function: scx_bpf_task_set_dsq_vtime, file: kernel/sched/ext.c, line: 8877}
            requires:
              locks:
                - {lock: rq, instance: task_rq(p), state: held, note: "hypothesis; not required or checked by the kernel"}
            basis: hypothesis
            evidence:
              - {kind: kernel_comment, file: include/linux/sched/ext.h, line: 210, end_line: 231, note: "fields documented as BPF-modifiable; no lock rule stated"}
          - id: dsq_insert
            access: {struct: task_struct, fields: [scx.slice, scx.dsq_vtime], op: write, instance: p}
            sites:
              - {function: scx_bpf_dsq_insert___v2, file: kernel/sched/ext.c, line: 8207, end_line: 8210}
              - {function: scx_dsq_insert_vtime, file: kernel/sched/ext.c, line: 8233, end_line: 8238}
            requires:
              locks:
                - {lock: rq, instance: task_rq(p), state: held, note: "hypothesis; from ops.dispatch p may be any task, whose rq is not held"}
            basis: hypothesis
            evidence:
              - {kind: kernel_comment, file: kernel/sched/ext.c, line: 8175, end_line: 8182, symbol: scx_bpf_dsq_insert, note: "no restrictions on @p from ops.dispatch; 'doesn't have any locking restrictions'"}
        applies_to: [scx_bpf_task_set_slice, scx_bpf_task_set_dsq_vtime, scx_bpf_dsq_insert, scx_bpf_dsq_insert___v2, __scx_bpf_dsq_insert_vtime, scx_bpf_dsq_insert_vtime]
        enforcement:
          expected: none
          mechanisms: [none]
        references:
          - {file: kernel/sched/ext.c, line: 8844, end_line: 8878, symbol: scx_bpf_task_set_slice}
          - {file: kernel/sched/ext.c, line: 1338, end_line: 1350, symbol: update_curr_scx}
        notes: "Kept as draft so that no consumer turns it into violations. The authority check (scx_task_on_sched) is an I2 ownership fact."

