          must equal scx_locked_rq() (else scx_error "cross-task"); otherwise it
          takes p->pi_lock itself. The only rq-locked select_task_rq() caller,
          proxy_force_return() (core.c:6797), needs SCHED_PROXY_EXEC, which
          depends on !SCHED_CLASS_EXT (init/Kconfig:938).
