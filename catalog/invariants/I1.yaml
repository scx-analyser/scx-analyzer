              checked_by: [select_cpu_from_kfunc, scx_kf_arg_task_ok]
              on_failure: error
            - expr: "!scx_locked_rq() || task_rq(p) == scx_locked_rq()"
              checked_by: [select_cpu_from_kfunc]
