      - id: I1.dsq_move.context
        title: "Entry state: DSQ-iterator move kfuncs are callable from ops.dispatch (dispatch set) or from rq-unlocked contexts (unlocked set)"
        description: >-
          scx_bpf_dsq_move* are members of both the dispatch and the unlocked
          sets: either set allowing the call suffices, and the two are separate
          alternatives (dispatch set: ops.dispatch on STRUCT_OPS; unlocked set:
          the UNLOCKED ops and SYSCALL programs). scx_dsq_move() distinguishes
          the cases at runtime with this_rq->scx.flags & SCX_RQ_IN_BALANCE: in
          balance it may unlock this_rq and lock task_rq(p); otherwise it locks
          task_rq(p) itself, then dsq->lock.
