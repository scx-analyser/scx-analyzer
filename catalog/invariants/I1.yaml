      - id: I1.dsq_insert.context
        title: "Entry state: DSQ insertion kfuncs (enqueue_dispatch set) are callable only from ops.select_cpu, ops.enqueue and ops.dispatch"
        description: >-
          scx_kfunc_ids_enqueue_dispatch is granted by SCX_KF_ALLOW_ENQUEUE, which
          scx_kf_allow_flags[] gives to select_cpu, enqueue and dispatch. Locks
          held on entry: select_cpu -> p->pi_lock, no rq lock passed; enqueue ->
          rq(task_rq(p)); dispatch -> rq(this_cpu). The kfunc asserts irqs are
          disabled (lockdep). The guards on the writes it makes are in
          I1.dsq_insert.commit_guards.
        category: context_locking
        status: source_verified
        role: entry_state
        objects: []
        access: none
        requires:
          contexts:
            kfunc_sets: [scx_kfunc_ids_enqueue_dispatch]
            callbacks: [ops.select_cpu, ops.enqueue, ops.dispatch]
            program_types: [BPF_PROG_TYPE_STRUCT_OPS]
          locks:
            - {lock: irqs_disabled, state: held, where: access_site, note: "lockdep_assert_irqs_disabled() in scx_dsq_insert_preamble()"}
            - {lock: pi_lock, state: held, where: callback_entry, callbacks: [ops.select_cpu], note: "try_to_wake_up() holds p->pi_lock; SCX_CALL_OP_TASK_RET(select_cpu, NULL)"}
            - {lock: rq, state: held, where: callback_entry, callbacks: [ops.enqueue], note: "callback's rq = task_rq(p), do_enqueue_task()"}
            - {lock: rq, state: held, where: callback_entry, callbacks: [ops.dispatch], note: "this CPU's rq, balance_one()/scx_dispatch_sched()"}
            - {lock: bpf_spin_lock, state: not_held, where: access_site}
        applies_to: [scx_bpf_dsq_insert, scx_bpf_dsq_insert___v2, __scx_bpf_dsq_insert_vtime, scx_bpf_dsq_insert_vtime]
        enforcement:
          expected: static
          mechanisms: [kfunc_set, verifier, lockdep]
          sites:
            - {file: kernel/sched/ext.c, line: 8331, end_line: 8336, symbol: scx_kfunc_ids_enqueue_dispatch}
            - {file: kernel/sched/ext.c, line: 9936, end_line: 9937, symbol: scx_init, note: "registered for BPF_PROG_TYPE_STRUCT_OPS only"}
            - {file: kernel/sched/ext.c, line: 9912, symbol: scx_kfunc_context_filter, note: "in_enqueue && SCX_KF_ALLOW_ENQUEUE"}
            - {file: kernel/sched/ext.c, line: 8102, symbol: scx_dsq_insert_preamble, note: "lockdep_assert_irqs_disabled()"}
        references:
          - {file: kernel/sched/ext.c, line: 9829, end_line: 9831, symbol: scx_kf_allow_flags, note: "select_cpu, enqueue, dispatch carry SCX_KF_ALLOW_ENQUEUE"}
          - {file: kernel/sched/ext.c, line: 3334, end_line: 3339, symbol: select_task_rq_scx, note: "sets direct_dispatch_task=p, calls ops.select_cpu with locked_rq=NULL"}
          - {file: kernel/sched/ext.c, line: 1948, symbol: do_enqueue_task, note: "SCX_CALL_OP_TASK(enqueue, rq)"}
          - {file: kernel/sched/ext.c, line: 2840, end_line: 2844, symbol: scx_dispatch_sched, note: "SCX_CALL_OP(dispatch, rq)"}

      - id: I1.dispatch_only.context
        title: "Entry state: dispatch-only kfuncs (dispatch set minus dsq_move*) are callable only from ops.dispatch"
        description: >-
          scx_kfunc_ids_dispatch is granted by SCX_KF_ALLOW_DISPATCH, which only
          ops.dispatch has. ops.dispatch runs from balance_one() ->
          scx_dispatch_sched() with this CPU's rq lock held (also nested via
          scx_bpf_sub_dispatch()). These kfuncs rely on the per-CPU dsp_ctx
          (cursor, rq) set up for the current dispatch round but perform no
          runtime context check; scx_bpf_dsq_move_to_local() may drop and retake
          rq locks and must not run under a BPF spin lock.
        category: context_locking
        status: source_verified
        role: entry_state
        objects: []
        access: none
        requires:
          contexts:
            kfunc_sets: [scx_kfunc_ids_dispatch]
            callbacks: [ops.dispatch]
