# Invariant family I1 - locking requirements for protected scheduler-state writes.
#
# Source of truth: Linux v7.1 (commit below), the course kernel: kernel/sched/ext.c,
# kernel/sched/ext_idle.c, kernel/sched/ext_internal.h, kernel/sched/sched.h,
# include/linux/sched/ext.h, kernel/bpf/{verifier,btf}.c. Write-up: I1.md.
#
# Structure: one family entry (id I1, the id checker plug-ins register under and
# findings report) with two kinds of rules:
# - role: protection - the invariant proper. Each obligation binds one write
#   (struct, fields, instance, op) at named source sites to the specific lock
#   instance / predicate that protects it, with a basis (checked, documented,
#   observed, hypothesis) and evidence. Hypotheses live only in draft rules.
#   I1.nonlocal_dsq.dsq_lock and I1.local_dsq.rq_lock carry the end-to-end
#   call paths of the worked example scx_bpf_dsq_move_to_local___v2.
# - role: entry_state - supporting information for C2/C3: calling contexts
#   (kfunc sets, callbacks, program types) and locks held on callback entry.
#   These are not the invariant; they say which locks are already held when a
#   kfunc's path starts. Every sched_ext kfunc registered in v7.1 (59 unique
#   names) appears in exactly one entry_state rule; I1.bpf_spin_lock.no_calls
#   and I1.prog_type.gate additionally apply to all ("*").
#
# Conventions:
# - Expressions in obligations (access.instance, lock instance, when, predicates)
#   are in the scope of the site function; in paths, in the step's function.
# - In entry_state rules, lock `rq` without instance = the rq the callback was
#   invoked with (C2's "callback's rq"): this CPU's rq for dispatch /
#   cpu_release / cpu_acquire, task_rq(p) for enqueue and the other task ops.
#   not_held at callback_entry is the documented precondition of the cited call
#   sites, not an object-specific absence fact for every ambient rq.
# - "UNLOCKED ops" = the callbacks mapped to SCX_KF_ALLOW_UNLOCKED in
#   scx_kf_allow_flags[] (ext.c:9833-9849).
# - enforcement.expected counts only checks active in production kernels;
#   lockdep_assert_*() is mechanism `lockdep` and never makes a rule "runtime".
# - v7.1 has no current->scx.kf_mask / scx_kf_allowed(); per-op context
#   restriction is verifier-time (ext.c:9808-9917).
kernel_version: "v7.1"
kernel_commit: 8cd9520d35a6c38db6567e97dd93b1f11f185dc6
invariants:
  - id: I1
    title: "Shared scheduler state written along sched_ext kfunc call paths is modified only under the lock (or guard) that protects it"
    description: >-
      Locking requirements for protected scheduler-state writes in Linux v7.1.
      For the shared fields that sched_ext kfuncs modify, directly or along
      their kernel call paths (DSQ queues and counters, a task's DSQ linkage,
      rq->scx fields, p->scx.ops_state, p->scx.slice / dsq_vtime, the
      direct-dispatch and dispatch-buffer state), each protection rule names the
      write sites and the specific lock instance or predicate required there,
      with the kernel evidence (lockdep assertions, acquisitions on the path,
      kernel comments). Calling-context rules are kept as supporting entry state
      (role entry_state). See I1.md.
    category: context_locking
    rules:
      # ------------------------------------------------------------------
      # Protection rules (the invariant)
      # ------------------------------------------------------------------
      - id: I1.nonlocal_dsq.dsq_lock
        title: "A non-local DSQ's queue state and a task's link into it are written with that DSQ's lock held"
        description: >-
          For user, global and bypass DSQs (dsq->id != SCX_DSQ_LOCAL) the list,
          priority tree, nr, seq and first_task of the DSQ, and the queued task's
          dsq_list / dsq_priq / dsq_flags / dsq_seq / dsq links, are modified only
          inside dsq->lock. dispatch_enqueue() takes the lock itself; every caller
          of task_unlink_from_dsq() on a non-local DSQ either takes it or asserts
          it. dsq->nr is written with WRITE_ONCE() because
          scx_bpf_dsq_nr_queued() reads it without the lock (ext.c:1369), and
          first_task with rcu_assign_pointer() for the lockless peek; those
          readers do not weaken the writer requirement. Local DSQs are covered by
          I1.local_dsq.rq_lock.
        category: context_locking
        status: source_verified
        role: protection
        objects:
          - {struct: scx_dispatch_q, fields: [list, priq, nr, seq, first_task]}
          - {struct: task_struct, fields: [scx.dsq_list.node, scx.dsq_priq, scx.dsq_flags, scx.dsq_seq, scx.dsq]}
        access: write
        requires:
          locks:
            - {lock: bpf_spin_lock, state: not_held, where: access_site, note: "kfunc-wide context condition (I1.bpf_spin_lock.no_calls), not field protection"}
        obligations:
          - id: enqueue_dsq
            access: {struct: scx_dispatch_q, fields: [list, priq, nr, seq, first_task], op: write, instance: dsq}
            sites:
              - {function: dispatch_enqueue, file: kernel/sched/ext.c, line: 1568, end_line: 1613, note: "rb_add 1568, list_add* 1579-1603, first_task 1584/1596/1605, seq 1610, dsq_inc_nr 1613 (nr at 1370)"}
            when: "dsq->id != SCX_DSQ_LOCAL"
            requires:
              locks:
                - {lock: dsq, instance: dsq, state: held}
            basis: observed
            evidence:
              - {kind: acquired_on_path, file: kernel/sched/ext.c, line: 1528, end_line: 1530, symbol: dispatch_enqueue, note: "if (!is_local) raw_spin_lock_nested(&dsq->lock)"}
              - {kind: acquired_on_path, file: kernel/sched/ext.c, line: 1535, end_line: 1537, symbol: dispatch_enqueue, note: "destroyed DSQ: unlock, switch to the global DSQ, lock it"}
              - {kind: acquired_on_path, file: kernel/sched/ext.c, line: 1635, symbol: dispatch_enqueue, note: "released only after the writes"}
          - id: enqueue_task_link
            access: {struct: task_struct, fields: [scx.dsq_list.node, scx.dsq_priq, scx.dsq_seq, scx.dsq], op: write, instance: p}
            sites:
              - {function: dispatch_enqueue, file: kernel/sched/ext.c, line: 1568, end_line: 1614, note: "dsq_priq 1568, dsq_list.node 1579-1603, dsq_seq 1611, p->scx.dsq 1614"}
            when: "dsq->id != SCX_DSQ_LOCAL"
            requires:
              locks:
                - {lock: dsq, instance: dsq, state: held}
            basis: observed
            evidence:
              - {kind: acquired_on_path, file: kernel/sched/ext.c, line: 1528, end_line: 1530, symbol: dispatch_enqueue}
            note: "p's task_rq lock is not required here: dispatch_enqueue() is also reached from finish_dispatch() (2746) on the dispatching CPU, where p is owned through SCX_OPSS_DISPATCHING, not through its rq lock."
          - id: unlink_dsq
            access: {struct: scx_dispatch_q, fields: [list, priq, nr, first_task], op: write, instance: dsq}
            sites:
              - {function: task_unlink_from_dsq, file: kernel/sched/ext.c, line: 1652, end_line: 1664, note: "rb_erase 1652, list_del_init 1657, dsq_dec_nr 1658 (nr at 1408), first_task 1664"}
            when: "dsq->id != SCX_DSQ_LOCAL"
            requires:
              locks:
                - {lock: dsq, instance: dsq, state: held}
            basis: observed
            evidence:
              - {kind: acquired_on_path, file: kernel/sched/ext.c, line: 1695, end_line: 1696, symbol: dispatch_dequeue, note: "caller 1704 takes dsq->lock when !is_local"}
              - {kind: lockdep_assert, file: kernel/sched/ext.c, line: 1729, symbol: dispatch_dequeue_locked, note: "caller 1731"}
              - {kind: lockdep_assert, file: kernel/sched/ext.c, line: 2412, symbol: unlink_dsq_and_lock_src_rq, note: "caller 2415"}
              - {kind: lockdep_assert, file: kernel/sched/ext.c, line: 2466, symbol: move_task_between_dsqs, note: "caller 2489"}
              - {kind: acquired_on_path, file: kernel/sched/ext.c, line: 2525, symbol: consume_dispatch_q, note: "caller 2542"}
              - {kind: lockdep_assert, file: kernel/sched/ext.c, line: 588, symbol: nldsq_next_task, note: "reached from 1663 when first_task == p"}
            paths:
              - root: scx_bpf_dsq_move_to_local___v2
                entry:
                  - {function: balance_one, file: kernel/sched/ext.c, line: 2890, note: "lockdep_assert_rq_held(rq); SCX_RQ_IN_BALANCE set at 2891"}
                  - {function: scx_dispatch_sched, file: kernel/sched/ext.c, line: 2844, note: "dspc->rq = rq (2827); SCX_CALL_OP(sch, dispatch, rq, ...) -> update_locked_rq() asserts rq (465-466)"}
                steps:
                  - {function: scx_bpf_dsq_move_to_local___v2, file: kernel/sched/ext.c, line: 8538, call: "consume_dispatch_q(sch, dspc->rq, dsq, enq_flags)", held: [{lock: rq, instance: dspc->rq}]}
                  - {function: consume_dispatch_q, file: kernel/sched/ext.c, line: 2542, call: "task_unlink_from_dsq(p, dsq)", held: [{lock: rq, instance: rq}, {lock: dsq, instance: dsq}], note: "same-rq branch (rq == task_rq(p), 2541); dsq->lock taken at 2525"}
                  - {function: task_unlink_from_dsq, file: kernel/sched/ext.c, line: 1658, held: [{lock: rq, instance: task_rq(p)}, {lock: dsq, instance: dsq}]}
              - root: scx_bpf_dsq_move_to_local___v2
                steps:
                  - {function: scx_bpf_dsq_move_to_local___v2, file: kernel/sched/ext.c, line: 8538, call: "consume_dispatch_q(sch, dspc->rq, dsq, enq_flags)", held: [{lock: rq, instance: dspc->rq}]}
                  - {function: consume_dispatch_q, file: kernel/sched/ext.c, line: 2549, call: "consume_remote_task(rq, p, enq_flags, dsq, task_rq)", held: [{lock: rq, instance: rq}, {lock: dsq, instance: dsq}], note: "remote branch, after task_can_run_on_remote_rq() (2548)"}
                  - {function: consume_remote_task, file: kernel/sched/ext.c, line: 2432, call: "unlink_dsq_and_lock_src_rq(p, dsq, src_rq)", held: [{lock: dsq, instance: dsq}], note: "this_rq unlocked at 2430"}
                  - {function: unlink_dsq_and_lock_src_rq, file: kernel/sched/ext.c, line: 2415, call: "task_unlink_from_dsq(p, dsq)", held: [{lock: dsq, instance: dsq}], note: "lockdep_assert_held(&dsq->lock) 2412; then holding_cpu = cpu (2416), unlock dsq (2418), lock src_rq (2419)"}
                  - {function: task_unlink_from_dsq, file: kernel/sched/ext.c, line: 1658, held: [{lock: dsq, instance: dsq}], note: "no rq lock held: the DSQ lock alone protects the unlink"}
          - id: unlink_task_link
            access: {struct: task_struct, fields: [scx.dsq_list.node, scx.dsq_priq], op: write, instance: p}
            sites:
              - {function: task_unlink_from_dsq, file: kernel/sched/ext.c, line: 1652, end_line: 1657}
            when: "dsq->id != SCX_DSQ_LOCAL"
            requires:
              locks:
                - {lock: dsq, instance: dsq, state: held}
            basis: observed
            evidence:
              - {kind: lockdep_assert, file: kernel/sched/ext.c, line: 2412, symbol: unlink_dsq_and_lock_src_rq}
              - {kind: acquired_on_path, file: kernel/sched/ext.c, line: 2525, symbol: consume_dispatch_q}
              - {kind: acquired_on_path, file: kernel/sched/ext.c, line: 1696, symbol: dispatch_dequeue}
          - id: dsq_flags
            access: {struct: task_struct, fields: [scx.dsq_flags], op: write, instance: p}
            sites:
              - {function: dispatch_enqueue, file: kernel/sched/ext.c, line: 1567}
              - {function: task_unlink_from_dsq, file: kernel/sched/ext.c, line: 1654}
            requires:
              locks:
                - {lock: dsq, instance: dsq, state: held}
            basis: documented
            evidence:
              - {kind: kernel_comment, file: include/linux/sched/ext.h, line: 195, note: "u32 dsq_flags; /* protected by DSQ lock */"}
              - {kind: acquired_on_path, file: kernel/sched/ext.c, line: 1529, symbol: dispatch_enqueue}
            note: "Only PRIQ DSQs set the flag, and built-in DSQs cannot be PRIQ (1541-1552), so these sites are always on a non-local DSQ."
        applies_to: [scx_bpf_dsq_move_to_local, scx_bpf_dsq_move_to_local___v2, scx_bpf_dsq_move, scx_bpf_dsq_move_vtime]
        enforcement:
          expected: runtime
          mechanisms: [lock, lockdep]
          sites:
            - {file: kernel/sched/ext.c, line: 1528, end_line: 1530, symbol: dispatch_enqueue}
            - {file: kernel/sched/ext.c, line: 2525, symbol: consume_dispatch_q}
            - {file: kernel/sched/ext.c, line: 8401, symbol: scx_dsq_move}
            - {file: kernel/sched/ext.c, line: 2412, symbol: unlink_dsq_and_lock_src_rq, note: "lockdep only"}
        references:
          - {file: include/linux/sched/ext.h, line: 81, end_line: 94, symbol: scx_dispatch_q}
          - {file: kernel/sched/ext.c, line: 1518, end_line: 1644, symbol: dispatch_enqueue}
          - {file: kernel/sched/ext.c, line: 1646, end_line: 1666, symbol: task_unlink_from_dsq}
          - {file: kernel/sched/ext.c, line: 2512, end_line: 2557, symbol: consume_dispatch_q}
        notes: "applies_to lists the kfuncs whose own call path reaches these writes (move_to_local via consume_dispatch_q and flush_dispatch_buf -> finish_dispatch -> dispatch_enqueue; dsq_move* via move_task_between_dsqs). scx_bpf_dsq_insert* only record the request; the write happens later in the core (direct_dispatch / finish_dispatch)."

      - id: I1.local_dsq.rq_lock
        title: "A local DSQ and a task's link into it are written with the owning rq's lock held"
        description: >-
          Local DSQs (rq->scx.local_dsq) have no DSQ lock in use: they are
          protected by their rq's lock (ext.c:2574-2576). move_local_task_to_local_dsq()
          asserts the destination rq lock (and the source DSQ lock it is moving
          from); dispatch_enqueue() on a local DSQ relies on the caller holding the
          owning rq, which direct_dispatch() guarantees by deferring remote local
          DSQs (1830-1834) and dispatch_to_local_dsq() by locking the target rq.
        category: context_locking
        status: source_verified
        role: protection
        objects:
          - {struct: scx_dispatch_q, fields: [list, nr, seq]}
          - {struct: task_struct, fields: [scx.dsq_list.node, scx.dsq]}
          - {struct: rq, fields: [scx.nr_immed]}
        access: write
        requires:
          locks:
            - {lock: bpf_spin_lock, state: not_held, where: access_site, note: "kfunc-wide context condition, not field protection"}
        obligations:
          - id: move_local_dst
            access: {struct: scx_dispatch_q, fields: [list, nr], op: write, instance: dst_dsq}
            sites:
              - {function: move_local_task_to_local_dsq, file: kernel/sched/ext.c, line: 2261, end_line: 2266, note: "list_add[_tail] 2262/2264, dsq_inc_nr 2266"}
            requires:
              locks:
                - {lock: rq, instance: dst_rq, state: held}
            basis: checked
            evidence:
              - {kind: lockdep_assert, file: kernel/sched/ext.c, line: 2257, symbol: move_local_task_to_local_dsq, note: "lockdep_assert_rq_held(dst_rq)"}
              - {kind: kernel_comment, file: kernel/sched/ext.c, line: 2574, end_line: 2576, symbol: dispatch_to_local_dsq, note: "local DSQs are protected with rq locks"}
            paths:
              - root: scx_bpf_dsq_move_to_local___v2
                entry:
                  - {function: balance_one, file: kernel/sched/ext.c, line: 2890, note: "lockdep_assert_rq_held(rq)"}
                  - {function: scx_dispatch_sched, file: kernel/sched/ext.c, line: 2844, note: "SCX_CALL_OP(sch, dispatch, rq, ...)"}
                steps:
                  - {function: scx_bpf_dsq_move_to_local___v2, file: kernel/sched/ext.c, line: 8538, call: "consume_dispatch_q(sch, dspc->rq, dsq, enq_flags)", held: [{lock: rq, instance: dspc->rq}]}
                  - {function: consume_dispatch_q, file: kernel/sched/ext.c, line: 2543, call: "move_local_task_to_local_dsq(sch, p, enq_flags, dsq, rq)", held: [{lock: rq, instance: rq}, {lock: dsq, instance: dsq}]}
                  - {function: move_local_task_to_local_dsq, file: kernel/sched/ext.c, line: 2266, held: [{lock: rq, instance: dst_rq}, {lock: dsq, instance: src_dsq}], note: "dsq->lock dropped by the caller at 2544 after return"}
          - id: move_local_task_link
            access: {struct: task_struct, fields: [scx.dsq_list.node, scx.dsq], op: write, instance: p}
            sites:
              - {function: move_local_task_to_local_dsq, file: kernel/sched/ext.c, line: 2262, end_line: 2267}
            requires:
              locks:
                - {lock: rq, instance: dst_rq, state: held}
                - {lock: dsq, instance: src_dsq, state: held}
            basis: checked
            evidence:
              - {kind: lockdep_assert, file: kernel/sched/ext.c, line: 2256, end_line: 2257, symbol: move_local_task_to_local_dsq, note: "both asserted: src_dsq->lock and dst_rq"}
            paths:
              - root: scx_bpf_dsq_move_to_local___v2
                steps:
                  - {function: scx_bpf_dsq_move_to_local___v2, file: kernel/sched/ext.c, line: 8538, call: "consume_dispatch_q(sch, dspc->rq, dsq, enq_flags)", held: [{lock: rq, instance: dspc->rq}]}
                  - {function: consume_dispatch_q, file: kernel/sched/ext.c, line: 2543, call: "move_local_task_to_local_dsq(sch, p, enq_flags, dsq, rq)", held: [{lock: rq, instance: rq}, {lock: dsq, instance: dsq}]}
                  - {function: move_local_task_to_local_dsq, file: kernel/sched/ext.c, line: 2267, held: [{lock: rq, instance: dst_rq}, {lock: dsq, instance: src_dsq}]}
          - id: immed_count
            access: {struct: rq, fields: [scx.nr_immed], op: write, instance: "container_of(dsq, struct rq, scx.local_dsq)"}
            sites:
              - {function: dsq_inc_nr, file: kernel/sched/ext.c, line: 1394}
              - {function: dsq_dec_nr, file: kernel/sched/ext.c, line: 1417}
            when: "p->scx.flags & SCX_TASK_IMMED"
            requires:
              locks:
                - {lock: rq, instance: "container_of(dsq, struct rq, scx.local_dsq)", state: held}
            basis: documented
            evidence:
              - {kind: kernel_comment, file: kernel/sched/ext.c, line: 2574, end_line: 2576, note: "local DSQs are protected with rq locks; IMMED tasks are only counted on a local DSQ (1381-1392, 1413)"}
          - id: enqueue_local
            access: {struct: scx_dispatch_q, fields: [list, nr, seq], op: write, instance: dsq}
            sites:
              - {function: dispatch_enqueue, file: kernel/sched/ext.c, line: 1593, end_line: 1613}
            when: "dsq->id == SCX_DSQ_LOCAL"
            requires:
              locks:
                - {lock: rq, instance: "container_of(dsq, struct rq, scx.local_dsq)", state: held}
            basis: documented
            evidence:
              - {kind: kernel_comment, file: kernel/sched/ext.c, line: 2574, end_line: 2576, symbol: dispatch_to_local_dsq}
              - {kind: kernel_comment, file: kernel/sched/ext.c, line: 1830, end_line: 1834, symbol: direct_dispatch, note: "remote local DSQ cannot be locked here, so the enqueue is deferred"}
            note: "dispatch_enqueue() itself takes no lock for a local DSQ (1528) and asserts none; the requirement is on its callers. Not every caller was audited as observed; basis is the kernel comment."
        applies_to: [scx_bpf_dsq_move_to_local, scx_bpf_dsq_move_to_local___v2, scx_bpf_dsq_move, scx_bpf_dsq_move_vtime]
        enforcement:
          expected: runtime
          mechanisms: [lock, lockdep]
          sites:
            - {file: kernel/sched/ext.c, line: 2890, symbol: balance_one, note: "rq held for ops.dispatch (lockdep)"}
            - {file: kernel/sched/ext.c, line: 2256, end_line: 2257, symbol: move_local_task_to_local_dsq, note: "lockdep"}
            - {file: kernel/sched/ext.c, line: 2295, symbol: move_remote_task_to_local_dsq, note: "raw_spin_rq_lock(dst_rq)"}
        references:
          - {file: kernel/sched/ext.c, line: 2248, end_line: 2270, symbol: move_local_task_to_local_dsq}
          - {file: kernel/sched/ext.c, line: 2566, end_line: 2580, symbol: dispatch_to_local_dsq, note: "kernel-doc"}
          - {file: kernel/sched/sched.h, line: 793, end_line: 794, symbol: scx_rq, note: "local_dsq is embedded in struct scx_rq"}

      - id: I1.rq_scx.rq_lock
        title: "rq->scx fields written on kfunc paths (cpuperf_target, extra_enq_flags, flags) are written with that rq's lock held"
        description: >-
          scx_bpf_cpuperf_set() writes cpu_rq(cpu)->scx.cpuperf_target either
          after taking that rq's lock or, when an rq is already tracked as locked,
          only if it is that rq (scx_error and return otherwise).
          move_remote_task_to_local_dsq(), reached from scx_bpf_dsq_move_to_local
          and scx_bpf_dsq_move*, sets dst_rq->scx.extra_enq_flags right after
          locking dst_rq. balance_one() sets rq->scx.flags under an asserted rq
          lock before ops.dispatch. Sites outside kfunc paths are not covered
          (e.g. scx_root_enable_workfn sets cpuperf_target for every CPU at 6879
          without rq locks, before the scheduler runs).
        category: context_locking
        status: source_verified
        role: protection
        objects:
          - {struct: rq, fields: [scx.cpuperf_target, scx.extra_enq_flags, scx.flags]}
        access: write
        requires:
          locks:
            - {lock: bpf_spin_lock, state: not_held, where: access_site}
        obligations:
          - id: cpuperf_target
            access: {struct: rq, fields: [scx.cpuperf_target], op: write, instance: rq}
            sites:
              - {function: scx_bpf_cpuperf_set, file: kernel/sched/ext.c, line: 9458, note: "rq = cpu_rq(cpu) (9437)"}
            requires:
              locks:
                - {lock: rq, instance: rq, state: held}
              predicates:
                - expr: "!locked_rq || rq == locked_rq"
                  captures:
                    - {var: locked_rq, expr: "scx_locked_rq()", function: scx_bpf_cpuperf_set, file: kernel/sched/ext.c, line: 9437}
                  evaluated_at: {function: scx_bpf_cpuperf_set, file: kernel/sched/ext.c, line: 9444}
                  checked_by: [scx_bpf_cpuperf_set]
                  on_failure: return
                  note: "scx_error('Invalid target CPU') at 9445, return at 9446 (ABBA prevention)"
            basis: checked
            evidence:
              - {kind: runtime_check, file: kernel/sched/ext.c, line: 9444, end_line: 9446, symbol: scx_bpf_cpuperf_set}
              - {kind: acquired_on_path, file: kernel/sched/ext.c, line: 9453, end_line: 9455, symbol: scx_bpf_cpuperf_set, note: "rq_lock_irqsave(rq) when no rq is tracked as locked; released 9461-9462"}
              - {kind: kernel_comment, file: kernel/sched/ext.c, line: 9440, end_line: 9452, symbol: scx_bpf_cpuperf_set}
            note: "When locked_rq == rq the lock is the caller's, as tracked by SCX_CALL_OP*() (update_locked_rq() asserts it under lockdep, 465-466). scx_locked_rq_state is only maintained around SCX ops: a TRACING program running while the core holds an rq lock outside an SCX op sees NULL and would rq_lock_irqsave() a possibly held rq. Potential deadlock, needs a test."
          - id: extra_enq_flags
            access: {struct: rq, fields: [scx.extra_enq_flags], op: write, instance: dst_rq}
            sites:
              - {function: move_remote_task_to_local_dsq, file: kernel/sched/ext.c, line: 2304, end_line: 2306}
            requires:
              locks:
                - {lock: rq, instance: dst_rq, state: held}
            basis: documented
            evidence:
