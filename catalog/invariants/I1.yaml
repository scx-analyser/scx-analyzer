          locks:
            - {lock: scx_dump_lock, state: held, where: callback_entry}
            - {lock: rq, state: held, where: callback_entry, callbacks: [ops.dump_cpu, ops.dump_task], note: "rq of the dumped CPU"}
          predicates:
            - expr: "raw_smp_processor_id() == dd->cpu"
              checked_by: [scx_bpf_dump_bstr]
              on_failure: error
        applies_to: [scx_bpf_dump_bstr]
        enforcement:
          expected: runtime
          mechanisms: [scx_error]
          sites:
            - {file: kernel/sched/ext.c, line: 9324, end_line: 9327, symbol: scx_bpf_dump_bstr, note: "scx_error 'must only be called from ops.dump() and friends'"}
        references:
          - {file: kernel/sched/ext.c, line: 6337, symbol: scx_dump_state, note: "guard(raw_spinlock_irqsave)(&scx_dump_lock)"}
          - {file: kernel/sched/ext.c, line: 6381, symbol: scx_dump_state, note: "rq_lock_irqsave before ops.dump_cpu/dump_task"}
        notes: "Weak check: only the CPU number is compared; a TRACING program on the dumping CPU (e.g. NMI) passes."

      - id: I1.task_cgroup.subject_task
        title: "Entry state: scx_bpf_task_cgroup may only be called on a task the current op operates on"
        description: >-
          @p must be current->scx.kf_tasks[0] or [1], i.e. the task argument of an
          op invoked via SCX_CALL_OP_TASK*() (which holds p's rq lock or, for
          select_cpu, p's pi_lock), so that p->sched_task_group is stable.
          Otherwise scx_error() and the root cgroup is returned.
        category: context_locking
        status: source_verified
        role: entry_state
        objects: []
        access: none
        requires:
          contexts:
            kfunc_sets: [scx_kfunc_ids_any]
            callbacks: [ops.select_cpu, ops.enqueue, ops.dequeue, ops.runnable, ops.running, ops.stopping, ops.quiescent, ops.yield, ops.core_sched_before, ops.set_weight, ops.set_cpumask, ops.tick, ops.enable, ops.disable, ops.exit_task, ops.cgroup_move]
          locks:
            - {lock: pi_lock, state: held, where: callback_entry, callbacks: [ops.select_cpu]}
            - {lock: rq, state: held, where: callback_entry, callbacks: [ops.enqueue, ops.dequeue, ops.runnable, ops.running, ops.stopping, ops.quiescent, ops.yield, ops.core_sched_before, ops.set_weight, ops.set_cpumask, ops.tick, ops.enable, ops.disable, ops.exit_task, ops.cgroup_move]}
          predicates:
            - expr: "p == current->scx.kf_tasks[0] || p == current->scx.kf_tasks[1]"
              checked_by: [scx_kf_arg_task_ok]
              on_failure: error
        applies_to: [scx_bpf_task_cgroup]
        enforcement:
          expected: runtime
          mechanisms: [scx_error]
          sites:
            - {file: kernel/sched/ext.c, line: 9754, symbol: scx_bpf_task_cgroup, note: "scx_kf_arg_task_ok()"}
        references:
          - {file: kernel/sched/ext.c, line: 9798, symbol: scx_kfunc_ids_any, note: "CONFIG_CGROUP_SCHED only"}
          - {file: kernel/sched/ext.c, line: 503, end_line: 546, symbol: SCX_CALL_OP_TASK, note: "kf_tasks[] protocol and lock guarantee"}

      - id: I1.bpf_spin_lock.no_calls
        title: "Entry state: no sched_ext kfunc may be called while the BPF program holds a bpf_spin_lock"
        description: >-
          The verifier rejects any call except spin_unlock/kptr_xchg and
          kfunc_spin_allowed() kfuncs while env->cur_state->active_locks is set.
          None of the SCX kfuncs is spin-allowed. This is what sched-ext.rst means
          by "cannot be called with any BPF locks held".
        category: context_locking
        status: source_verified
        role: entry_state
        objects: []
        access: none
        requires:
          locks:
            - {lock: bpf_spin_lock, state: not_held, where: access_site}
        applies_to: ["*"]
        enforcement:
          expected: static
          mechanisms: [verifier]
          sites:
            - {file: kernel/bpf/verifier.c, line: 17626, end_line: 17634, note: "'function calls are not allowed while holding a lock'"}
        references:
          - {file: Documentation/scheduler/sched-ext.rst, line: 373, note: "dsq_insert/move_to_local and BPF locks"}
          - {file: kernel/sched/ext.c, line: 8181, symbol: scx_bpf_dsq_insert, note: "kernel-doc says no locking restrictions (docs drift)"}

      - id: I1.prog_type.gate
        title: "Entry state: SCX kfuncs are denied to non-SCX struct_ops; TRACING gets only any+idle; SYSCALL gets unlocked+select_cpu+idle+any"
        description: >-
          Applies to every SCX kfunc. Enforced by which hooks each set is
          registered for and by scx_kfunc_context_filter(), invoked from
          btf_kfunc_is_allowed() during verification. While st_ops is not yet
          known (early kfunc collection) everything is allowed and the filter is
          re-run in do_check_main().
        category: context_locking
        status: source_verified
        role: entry_state
        objects: []
        access: none
        requires:
          contexts:
            program_types: [BPF_PROG_TYPE_STRUCT_OPS, BPF_PROG_TYPE_SYSCALL, BPF_PROG_TYPE_TRACING]
        applies_to: ["*"]
        enforcement:
          expected: static
          mechanisms: [kfunc_set, verifier]
          sites:
            - {file: kernel/sched/ext.c, line: 9860, end_line: 9917, symbol: scx_kfunc_context_filter}
            - {file: kernel/sched/ext.c, line: 9936, end_line: 9951, symbol: scx_init, note: "set registration per program type"}
            - {file: kernel/sched/ext_idle.c, line: 1515, end_line: 1519, symbol: scx_idle_init}
            - {file: kernel/bpf/btf.c, line: 8864, end_line: 8867, symbol: __btf_kfunc_is_allowed, note: "any filter returning non-zero denies"}
            - {file: kernel/bpf/verifier.c, line: 12612, note: "btf_kfunc_is_allowed() check at kfunc lookup"}
        references:
          - {file: kernel/sched/ext.c, line: 9877, end_line: 9878, symbol: scx_kfunc_context_filter, note: "SYSCALL rule"}
          - {file: kernel/sched/ext.c, line: 9880, end_line: 9881, symbol: scx_kfunc_context_filter, note: "TRACING (non-struct_ops) rule"}
          - {file: kernel/sched/ext.c, line: 9890, end_line: 9891, symbol: scx_kfunc_context_filter, note: "st_ops not set yet -> allow, re-checked later"}
          - {file: kernel/sched/ext.c, line: 9896, end_line: 9897, symbol: scx_kfunc_context_filter, note: "non-SCX struct_ops -> -EACCES"}
