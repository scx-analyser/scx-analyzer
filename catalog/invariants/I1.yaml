        status: source_verified
        role: entry_state
        objects: []
        access: none
        requires:
          contexts_any_of:
            - kfunc_sets: [scx_kfunc_ids_dispatch]
              callbacks: [ops.dispatch]
              program_types: [BPF_PROG_TYPE_STRUCT_OPS]
            - kfunc_sets: [scx_kfunc_ids_unlocked]
              callbacks: [ops.init_task, ops.dump, ops.cgroup_init, ops.cgroup_exit, ops.cgroup_prep_move, ops.cgroup_cancel_move, ops.cgroup_set_weight, ops.cgroup_set_bandwidth, ops.cgroup_set_idle, ops.sub_attach, ops.sub_detach, ops.cpu_online, ops.cpu_offline, ops.init, ops.exit]
              program_types: [BPF_PROG_TYPE_STRUCT_OPS, BPF_PROG_TYPE_SYSCALL]
          locks:
            - {lock: rq, state: held, where: callback_entry, callbacks: [ops.dispatch], note: "iff SCX_RQ_IN_BALANCE"}
            - {lock: rq, state: not_held, where: callback_entry, callbacks: [ops.init_task, ops.dump, ops.cgroup_init, ops.cgroup_exit, ops.cgroup_prep_move, ops.cgroup_cancel_move, ops.cgroup_set_weight, ops.cgroup_set_bandwidth, ops.cgroup_set_idle, ops.sub_attach, ops.sub_detach, ops.cpu_online, ops.cpu_offline, ops.init, ops.exit], note: "Precondition of the cited call sites: all pass locked_rq=NULL and none holds an rq lock there (not an absence fact for every ambient rq). init_task may sleep (sleepable member, ext.c:7616; 'This operation may block', ext_internal.h:570), so it cannot run under an rq spinlock; it is reached from scx_fork() after sched_cgroup_fork() dropped pi_lock (core.c:4783) and from scx_root_enable_workfn (6998), scx_sub_enable_workfn (7297) and scx_sub_disable (5820), each after scx_task_iter_unlock() dropped the iterator's rq lock (6996, 7291, 5807). dump (6365) is reached only via scx_dump_state() from the hard irq_work (6487) and SysRq-D (7820); the dumped CPU's rq is locked only later (6381) for dump_cpu/dump_task."}
            - {lock: scx_cgroup_ops_rwsem, state: held, where: callback_entry, callbacks: [ops.cgroup_set_weight, ops.cgroup_set_idle, ops.cgroup_set_bandwidth], note: "read side: percpu_down_read() at 4440, 4456, 4473. NOT held for ops.cgroup_cancel_move: its call sites scx_cgroup_can_attach (error path, 4389) and scx_cgroup_cancel_attach (4430) take no scx_cgroup_ops_rwsem"}
            - {lock: bpf_spin_lock, state: not_held, where: access_site}
        applies_to: [scx_bpf_dsq_move_set_slice, scx_bpf_dsq_move_set_vtime, scx_bpf_dsq_move, scx_bpf_dsq_move_vtime]
        enforcement:
          expected: static
          mechanisms: [kfunc_set, verifier]
          sites:
            - {file: kernel/sched/ext.c, line: 8701, end_line: 8705, symbol: scx_kfunc_ids_dispatch}
            - {file: kernel/sched/ext.c, line: 8816, end_line: 8820, symbol: scx_kfunc_ids_unlocked}
            - {file: kernel/sched/ext.c, line: 9944, end_line: 9945, symbol: scx_init, note: "unlocked set also registered for BPF_PROG_TYPE_SYSCALL"}
            - {file: kernel/sched/ext.c, line: 9878, symbol: scx_kfunc_context_filter, note: "SYSCALL progs: unlocked/select_cpu/idle/any allowed"}
        references:
          - {file: kernel/sched/ext.c, line: 8389, end_line: 8398, symbol: scx_dsq_move, note: "in_balance decides lock dance"}
          - {file: kernel/sched/ext.c, line: 8615, symbol: scx_bpf_dsq_move, note: "kernel-doc: ops.dispatch() or any BPF context which doesn't hold a rq lock"}
          - {file: kernel/sched/ext.c, line: 3572, symbol: __scx_init_task, note: "SCX_CALL_OP_RET(init_task, NULL)"}
          - {file: kernel/sched/ext.c, line: 7616, symbol: bpf_scx_check_member, note: "init_task may be sleepable"}
          - {file: kernel/sched/ext_internal.h, line: 569, end_line: 570, note: "init_task: 'This operation may block'"}
          - {file: kernel/sched/core.c, line: 4766, end_line: 4785, symbol: sched_cgroup_fork, note: "pi_lock released (4783) before scx_fork()"}
          - {file: kernel/sched/ext.c, line: 843, end_line: 850, symbol: scx_task_iter_unlock, note: "drops the visited task's rq lock and scx_tasks_lock"}
