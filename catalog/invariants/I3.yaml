# Invariant family I3 - CPU, affinity and argument validity checks that must
# dominate scheduling-state modifications.
#
# Source of truth: Linux v7.1 (commit below), the course kernel:
# kernel/sched/ext.c, kernel/sched/ext_idle.c, kernel/sched/sched.h,
# include/linux/sched/ext.h. Write-up: I3.md.
#
# Structure: one family entry (id I3). Every rule is role: protection. Each
# obligation names one write (struct, fields, instance, op) at its source
# sites and the predicate that must hold there, with the function that
# evaluates it (evaluated_at / checked_by) and what the source does when it
# fails (on_failure). The dominance shape is stated in each predicate note as
# "guard -> failure edge -> write":
# - early return: `if (!guard) return;` before the write (scx_kick_cpu);
# - branch: the write sits inside `if (guard) { ... }` and the false edge
#   skips it without a return (scx_bpf_cpuperf_set);
# - fallback: the failing argument is replaced (global DSQ) and the write
#   still happens, on a different object (find_dsq_for_dispatch,
#   move_task_between_dsqs, dispatch_to_local_dsq).
# I3.idle.kfunc_allowed_mask is a draft hypothesis (a missing check).
#
# Conventions:
# - Expressions are in the scope of the function named by evaluated_at /
#   the site function; in paths, in the step's function.
# - ops_cpu_valid() (ext.c:1098-1106) = __cpu_valid() (1083-1086:
#   0 <= cpu < nr_cpu_ids && cpu_possible(cpu)) or scx_error(). It does not
#   check that the CPU is online.
# - on_failure: return = explicit return before the write; error = scx_error()
#   and the write is skipped by control flow but no return statement (except
#   I3.dsq_id.vtime_ordering no_mixed_mode, a reporting check whose write still
#   happens; its basis is documented, and the note says so); fallback
#   = the write is redirected to the global DSQ; continue = the candidate is
#   skipped silently and the loop continues.
kernel_version: "v7.1"
kernel_commit: 8cd9520d35a6c38db6567e97dd93b1f11f185dc6
invariants:
  - id: I3
    title: "A CPU, task-affinity or DSQ-id argument supplied by the BPF scheduler is checked before the scheduler state it indexes or targets is modified (CPUs: range/possible-checked, not online-checked)"
    description: >-
      For sched_ext kfuncs that take a CPU number, a task or a DSQ id and then
      modify shared scheduler state, directly or along their kernel call paths,
      the validity check of that argument must dominate the write: CPU range
      checks (ops_cpu_valid) before per-CPU mask / rq writes, the affinity and
      migration check (task_can_run_on_remote_rq) before a task is moved to the
      local DSQ of another CPU, and DSQ-id resolution (find_dsq_for_dispatch,
      find_user_dsq) before a DSQ is written. Each obligation states the guard,
      the failure edge (return, scx_error, global-DSQ fallback, skip) and the
      protected write with exact lines. See I3.md.
    category: argument_validity
    rules:
      - id: I3.cpu_arg.kick_cpu
        title: "scx_bpf_kick_cpu: the target CPU is range-checked (ops_cpu_valid, early return) before its bit is set in this rq's kick masks"
        description: >-
          scx_kick_cpu() uses the BPF-supplied cpu as a bit index into
          this_rq->scx.cpus_to_kick / cpus_to_kick_if_idle / cpus_to_preempt /
          cpus_to_wait (cpumask_set_cpu) and, for SCX_KICK_IDLE, as cpu_rq(cpu).
          ops_cpu_valid() at ext.c:8886 is followed by an explicit return at
          8887, so every path to the writes at 8919-8926 passes the check. The
          flag combination SCX_KICK_IDLE | (PREEMPT or WAIT) is reported with
          scx_error() at 8909-8910 but does not return: the idle-kick write still
          happens and the PREEMPT/WAIT bits are ignored on that branch.
        category: argument_validity
        status: source_verified
        role: protection
        objects:
          - {struct: rq, fields: [scx.cpus_to_kick, scx.cpus_to_kick_if_idle, scx.cpus_to_preempt, scx.cpus_to_wait]}
        access: write
        requires:
          predicates:
            - expr: "ops_cpu_valid(sch, cpu, NULL)"
              evaluated_at: {function: scx_kick_cpu, file: kernel/sched/ext.c, line: 8886}
              checked_by: [scx_kick_cpu, ops_cpu_valid]
              on_failure: return
              note: "kfunc-wide: the same check also dominates cpu_rq(cpu) at 8907"
        obligations:
          - id: kick_masks
            access: {struct: rq, fields: [scx.cpus_to_kick, scx.cpus_to_kick_if_idle, scx.cpus_to_preempt, scx.cpus_to_wait], op: atomic, instance: this_rq}
            sites:
              - {function: scx_kick_cpu, file: kernel/sched/ext.c, line: 8919, note: "cpumask_set_cpu(cpu, this_rq->scx.cpus_to_kick_if_idle)"}
              - {function: scx_kick_cpu, file: kernel/sched/ext.c, line: 8921, note: "cpus_to_kick"}
              - {function: scx_kick_cpu, file: kernel/sched/ext.c, line: 8924, note: "cpus_to_preempt, when flags & SCX_KICK_PREEMPT"}
              - {function: scx_kick_cpu, file: kernel/sched/ext.c, line: 8926, note: "cpus_to_wait, when flags & SCX_KICK_WAIT"}
            requires:
              predicates:
                - expr: "ops_cpu_valid(sch, cpu, NULL)"
                  evaluated_at: {function: scx_kick_cpu, file: kernel/sched/ext.c, line: 8886}
                  checked_by: [ops_cpu_valid]
                  on_failure: return
                  note: "guard 8886 -> scx_error() inside ops_cpu_valid (1103) -> explicit return 8887 -> writes 8919/8921/8924/8926. The guard dominates every write: the only other exit before them is goto out at 8899 / 8915."
            basis: checked
            evidence:
              - {kind: runtime_check, file: kernel/sched/ext.c, line: 8886, end_line: 8887, symbol: scx_kick_cpu}
              - {kind: runtime_check, file: kernel/sched/ext.c, line: 1098, end_line: 1106, symbol: ops_cpu_valid, note: "__cpu_valid() or scx_error()"}
              - {kind: kernel_comment, file: kernel/sched/ext.c, line: 1094, end_line: 1096, symbol: ops_cpu_valid, note: "@cpu came from the BPF scheduler and can be any value"}
            paths:
              - root: scx_bpf_kick_cpu
                steps:
                  - {function: scx_bpf_kick_cpu, file: kernel/sched/ext.c, line: 8952, call: "scx_kick_cpu(sch, cpu, flags)", held: [], note: "only rcu (guard(rcu) 8949); sch != NULL checked at 8951"}
                  - {function: scx_kick_cpu, file: kernel/sched/ext.c, line: 8886, call: "ops_cpu_valid(sch, cpu, NULL)", held: [], note: "guard; return at 8887 on failure"}
                  - {function: scx_kick_cpu, file: kernel/sched/ext.c, line: 8921, held: [], note: "irqs disabled since 8889 (local_irq_save); this_rq is per-CPU, so no rq lock is needed for the mask write"}
            note: "The cpumask ops are atomic set_bit(); the masks are consumed by kick_cpus_irq_workfn() on this CPU."
        applies_to: [scx_bpf_kick_cpu]
        enforcement:
          expected: runtime
          mechanisms: [guard, scx_error]
          sites:
            - {file: kernel/sched/ext.c, line: 8886, end_line: 8887, symbol: scx_kick_cpu}
            - {file: kernel/sched/ext.c, line: 8909, end_line: 8910, symbol: scx_kick_cpu, note: "flag misuse: scx_error without return"}
        references:
          - {file: kernel/sched/ext.c, line: 8881, end_line: 8932, symbol: scx_kick_cpu}
          - {file: kernel/sched/ext.c, line: 8945, end_line: 8953, symbol: scx_bpf_kick_cpu}
          - {file: kernel/sched/ext.c, line: 1083, end_line: 1106, symbol: ops_cpu_valid}
          - {file: kernel/sched/sched.h, line: 806, end_line: 809, symbol: scx_rq, note: "kick cpumasks"}
        notes: "Worked example of I3 (I3.md). ops_cpu_valid() accepts possible but offline CPUs; kicking one only sets a bit (gap listed in I3.md)."

      - id: I3.cpu_arg.cpuperf_set
        title: "scx_bpf_cpuperf_set: the target CPU is range-checked before cpu_rq(cpu)->scx.cpuperf_target is written; the write is inside the guard's then-branch"
        description: >-
          scx_bpf_cpuperf_set() first rejects perf > SCX_CPUPERF_ONE with
          scx_error and an explicit return (9431-9434, a value-range check, I4),
          then evaluates ops_cpu_valid(sch, cpu, NULL) at 9436. There is no early
          return: rq = cpu_rq(cpu) (9437) and the write at 9458 are both inside
          the `if (ops_cpu_valid(...)) { ... }` block, so the false edge (after
          scx_error inside ops_cpu_valid) skips to the end of the function. The
          ABBA check (9444-9446) and the rq lock are I1.rq_scx.rq_lock.
        category: argument_validity
        status: source_verified
        role: protection
        objects:
          - {struct: rq, fields: [scx.cpuperf_target]}
        access: write
        requires:
          predicates:
            - expr: "ops_cpu_valid(sch, cpu, NULL)"
              evaluated_at: {function: scx_bpf_cpuperf_set, file: kernel/sched/ext.c, line: 9436}
              checked_by: [ops_cpu_valid]
              on_failure: error
        obligations:
          - id: cpuperf_target
            access: {struct: rq, fields: [scx.cpuperf_target], op: write, instance: rq}
            sites:
              - {function: scx_bpf_cpuperf_set, file: kernel/sched/ext.c, line: 9458, note: "rq = cpu_rq(cpu) at 9437"}
            requires:
              predicates:
                - expr: "ops_cpu_valid(sch, cpu, NULL)"
                  evaluated_at: {function: scx_bpf_cpuperf_set, file: kernel/sched/ext.c, line: 9436}
                  checked_by: [ops_cpu_valid]
                  on_failure: error
                  note: "branch dominance, no return: guard 9436 opens the block that contains cpu_rq(cpu) 9437 and the write 9458; false edge = scx_error() in ops_cpu_valid (1103), then the block is skipped and the function ends (9464). A guard analysis must treat 'write inside the then-branch' as dominated."
            basis: checked
            evidence:
              - {kind: runtime_check, file: kernel/sched/ext.c, line: 9436, end_line: 9437, symbol: scx_bpf_cpuperf_set}
              - {kind: runtime_check, file: kernel/sched/ext.c, line: 1098, end_line: 1106, symbol: ops_cpu_valid}
            paths:
              - root: scx_bpf_cpuperf_set
                steps:
                  - {function: scx_bpf_cpuperf_set, file: kernel/sched/ext.c, line: 9436, call: "ops_cpu_valid(sch, cpu, NULL)", held: []}
                  - {function: scx_bpf_cpuperf_set, file: kernel/sched/ext.c, line: 9458, held: [{lock: rq, instance: rq}], note: "rq taken at 9454 or already the caller's locked rq (9444)"}
        applies_to: [scx_bpf_cpuperf_set]
        enforcement:
          expected: runtime
          mechanisms: [guard, scx_error]
          sites:
            - {file: kernel/sched/ext.c, line: 9436, symbol: scx_bpf_cpuperf_set}
            - {file: kernel/sched/ext.c, line: 9431, end_line: 9434, symbol: scx_bpf_cpuperf_set, note: "perf range check, return"}
        references:
          - {file: kernel/sched/ext.c, line: 9421, end_line: 9464, symbol: scx_bpf_cpuperf_set}
        notes: "Read-only siblings scx_bpf_cpuperf_cap/cur (9372, 9400), scx_bpf_cpu_rq (9549) and scx_bpf_cpu_curr (9606) use the same check before indexing per-CPU data; they write nothing and are not obligations here."

      - id: I3.idle.cpu_arg
        title: "Idle-mask kfuncs: built-in idle tracking and the CPU argument are checked before a CPU's bit is cleared from the idle masks"
        description: >-
          scx_bpf_test_and_clear_cpu_idle() returns false unless built-in idle
          tracking is enabled (1272-1273) and ops_cpu_valid(cpu) holds
          (1275-1276), then clears the CPU from the idle cpu / smt masks in
          scx_idle_test_and_clear_cpu() (ext_idle.c:88-109). The select_cpu
          kfuncs (scx_bpf_select_cpu_dfl, __scx_bpf_select_cpu_and,
          scx_bpf_select_cpu_and) reach the same writer through
          select_cpu_from_kfunc(), which validates prev_cpu (920-921, return
          -EINVAL) and the idle-tracking switch (923-924, return -EBUSY) first.
          scx_bpf_pick_idle_cpu*() take no CPU argument: the cleared CPU comes
          from cpumask_any_and_distribute() and is < nr_cpu_ids by construction
          (ext_idle.c:124-131).
        category: argument_validity
        status: source_verified
        role: protection
        objects:
          - {struct: scx_idle_cpus, fields: [cpu, smt]}
        access: write
        requires:
          predicates:
            - expr: "ops_cpu_valid(sch, cpu, NULL)"
              checked_by: [ops_cpu_valid]
              on_failure: return
        obligations:
          - id: test_and_clear
            access: {struct: scx_idle_cpus, fields: [cpu, smt], op: atomic, instance: "idle_cpumask(node)"}
            sites:
              - {function: scx_idle_test_and_clear_cpu, file: kernel/sched/ext_idle.c, line: 102, end_line: 109, note: "cpumask_andnot / __cpumask_clear_cpu on smt (103/105), cpumask_test_and_clear_cpu on cpu (109)"}
            requires:
              predicates:
                - expr: "ops_cpu_valid(sch, cpu, NULL)"
                  evaluated_at: {function: scx_bpf_test_and_clear_cpu_idle, file: kernel/sched/ext_idle.c, line: 1275}
                  checked_by: [scx_bpf_test_and_clear_cpu_idle, ops_cpu_valid]
                  on_failure: return
                  note: "guard 1275 -> return false 1276 -> call 1278 -> writes 103-109"
                - expr: "check_builtin_idle_enabled(sch)"
                  evaluated_at: {function: scx_bpf_test_and_clear_cpu_idle, file: kernel/sched/ext_idle.c, line: 1272}
                  checked_by: [check_builtin_idle_enabled]
                  on_failure: return
                  note: "scx_error('built-in idle tracking is disabled') 875, return false 1273"
            basis: checked
            evidence:
              - {kind: runtime_check, file: kernel/sched/ext_idle.c, line: 1272, end_line: 1276, symbol: scx_bpf_test_and_clear_cpu_idle}
            paths:
              - root: scx_bpf_test_and_clear_cpu_idle
                steps:
                  - {function: scx_bpf_test_and_clear_cpu_idle, file: kernel/sched/ext_idle.c, line: 1278, call: "scx_idle_test_and_clear_cpu(cpu)", held: []}
                  - {function: scx_idle_test_and_clear_cpu, file: kernel/sched/ext_idle.c, line: 109, held: []}
          - id: select_cpu_prev
            access: {struct: scx_idle_cpus, fields: [cpu, smt], op: atomic, instance: "idle_cpumask(node)"}
            sites:
              - {function: scx_idle_test_and_clear_cpu, file: kernel/sched/ext_idle.c, line: 102, end_line: 109}
            requires:
              predicates:
                - expr: "ops_cpu_valid(sch, prev_cpu, NULL)"
                  evaluated_at: {function: select_cpu_from_kfunc, file: kernel/sched/ext_idle.c, line: 920}
                  checked_by: [select_cpu_from_kfunc, ops_cpu_valid]
                  on_failure: return
                  note: "guard 920 -> return -EINVAL 921 -> scx_idle_test_and_clear_cpu(prev_cpu) at 960 or via scx_select_cpu_dfl (961)"
            basis: checked
            evidence:
              - {kind: runtime_check, file: kernel/sched/ext_idle.c, line: 920, end_line: 924, symbol: select_cpu_from_kfunc}
            paths:
              - root: scx_bpf_select_cpu_dfl
                steps:
                  - {function: select_cpu_from_kfunc, file: kernel/sched/ext_idle.c, line: 960, call: "scx_idle_test_and_clear_cpu(prev_cpu)", held: [{lock: pi_lock, instance: p}], note: "per-CPU / migration-disabled branch (958); pi_lock held from select_cpu or taken at 948"}
                  - {function: scx_idle_test_and_clear_cpu, file: kernel/sched/ext_idle.c, line: 109, held: [{lock: pi_lock, instance: p}]}
        applies_to: [scx_bpf_test_and_clear_cpu_idle, scx_bpf_select_cpu_dfl, __scx_bpf_select_cpu_and, scx_bpf_select_cpu_and]
        enforcement:
          expected: runtime
          mechanisms: [guard, scx_error]
          sites:
            - {file: kernel/sched/ext_idle.c, line: 1272, end_line: 1276, symbol: scx_bpf_test_and_clear_cpu_idle}
            - {file: kernel/sched/ext_idle.c, line: 920, end_line: 924, symbol: select_cpu_from_kfunc}
        references:
          - {file: kernel/sched/ext_idle.c, line: 77, end_line: 110, symbol: scx_idle_test_and_clear_cpu}
          - {file: kernel/sched/ext_idle.c, line: 912, end_line: 978, symbol: select_cpu_from_kfunc}
          - {file: kernel/sched/ext_idle.c, line: 1262, end_line: 1279, symbol: scx_bpf_test_and_clear_cpu_idle}

      - id: I3.affinity.remote_local_dsq
        title: "A task is migrated to another CPU's local DSQ only if task_can_run_on_remote_rq() accepts the destination; otherwise it falls back to the global DSQ"
        description: >-
          Moving p to the local DSQ of a CPU other than task_cpu(p) ends in
          move_remote_task_to_local_dsq(), which does set_task_cpu(p,
          cpu_of(dst_rq)) (2292) and activate_task(dst_rq) (2305). Every caller
          first evaluates task_can_run_on_remote_rq(sch, p, dst_rq, enforce)
          (2328-2375): migration disabled -> false (2348-2352), CPU not in
          p->cpus_ptr (task_allowed_on_cpu) -> false (2361-2365), dst rq offline
          -> false (2368-2371). With enforce=true the first two also call
          scx_error() and the offline case counts SCX_EV_DISPATCH_LOCAL_DSQ_OFFLINE.
          BPF-directed moves (move_task_between_dsqs from scx_bpf_dsq_move*,
          dispatch_to_local_dsq from finish_dispatch and the deferred direct
          dispatches) use enforce=true and redirect to the global DSQ;
          consume_dispatch_q (scx_bpf_dsq_move_to_local) uses enforce=false and
          skips the task.
        category: argument_validity
        status: source_verified
        role: protection
        objects:
          - {struct: task_struct, fields: [cpu, wake_cpu]}
          - {struct: scx_dispatch_q, fields: [list, nr]}
        access: write
        requires:
          predicates:
            - expr: "task_can_run_on_remote_rq(sch, p, dst_rq, enforce)"
              checked_by: [task_can_run_on_remote_rq]
              on_failure: fallback
        obligations:
          - id: migrate_task
            access: {struct: task_struct, fields: [cpu, wake_cpu], op: write, instance: p}
            sites:
              - {function: move_remote_task_to_local_dsq, file: kernel/sched/ext.c, line: 2292, note: "set_task_cpu(p, cpu_of(dst_rq)); activate_task into dst_rq's local DSQ at 2305"}
            requires:
              predicates:
                - expr: "task_can_run_on_remote_rq(sch, p, dst_rq, true)"
                  evaluated_at: {function: move_task_between_dsqs, file: kernel/sched/ext.c, line: 2471}
                  checked_by: [move_task_between_dsqs, task_can_run_on_remote_rq]
                  on_failure: fallback
                  note: "guard 2471-2472 (only if src_rq != dst_rq) -> dst_dsq = global, dst_rq = src_rq, SCX_ENQ_GDSQ_FALLBACK (2473-2475) -> the remote branch 2495 is not taken, the task goes to the global DSQ via dispatch_enqueue"
                - expr: "task_can_run_on_remote_rq(sch, p, dst_rq, true)"
                  evaluated_at: {function: dispatch_to_local_dsq, file: kernel/sched/ext.c, line: 2601}
                  checked_by: [dispatch_to_local_dsq, task_can_run_on_remote_rq]
                  on_failure: fallback
                  note: "guard 2601-2602 -> dispatch_enqueue(global) 2603-2604 + explicit return 2605 -> write via move_remote_task_to_local_dsq at 2644. Valid across the lock switch because DISPATCHING pins task_rq and cpus_allowed (comment 2590-2591) and holding_cpu is re-checked at 2632."
                - expr: "task_can_run_on_remote_rq(sch, p, rq, false)"
                  evaluated_at: {function: consume_dispatch_q, file: kernel/sched/ext.c, line: 2548}
                  checked_by: [consume_dispatch_q, task_can_run_on_remote_rq]
                  on_failure: continue
                  note: "guard 2548 -> false: next task of the DSQ, no error -> true: consume_remote_task 2549 -> move_remote_task_to_local_dsq 2433"
            basis: checked
            evidence:
              - {kind: runtime_check, file: kernel/sched/ext.c, line: 2348, end_line: 2374, symbol: task_can_run_on_remote_rq}
              - {kind: runtime_check, file: kernel/sched/ext.c, line: 2471, end_line: 2476, symbol: move_task_between_dsqs}
              - {kind: runtime_check, file: kernel/sched/ext.c, line: 2601, end_line: 2605, symbol: dispatch_to_local_dsq}
              - {kind: runtime_check, file: kernel/sched/ext.c, line: 2548, end_line: 2552, symbol: consume_dispatch_q}
              - {kind: kernel_comment, file: kernel/sched/ext.c, line: 2310, end_line: 2327, symbol: task_can_run_on_remote_rq, note: "BPF scheduler must not migrate a migration-disabled task; allowed-mask violations are errors, offline is not"}
            paths:
              - root: scx_bpf_dsq_move
                steps:
                  - {function: scx_dsq_move, file: kernel/sched/ext.c, line: 8423, call: "move_task_between_dsqs(sch, p, enq_flags, src_dsq, dst_dsq)", held: [{lock: rq, instance: src_rq}, {lock: dsq, instance: src_dsq}], note: "dst_dsq from find_dsq_for_dispatch at 8410 (I3.dsq_id.dispatch_target)"}
                  - {function: move_task_between_dsqs, file: kernel/sched/ext.c, line: 2495, call: "move_remote_task_to_local_dsq(p, enq_flags, src_rq, dst_rq)", held: [{lock: rq, instance: src_rq}], note: "reached only if the guard at 2471 passed; src_dsq unlocked at 2494"}
                  - {function: move_remote_task_to_local_dsq, file: kernel/sched/ext.c, line: 2292, held: [{lock: rq, instance: src_rq}]}
              - root: scx_bpf_dsq_move_to_local___v2
                steps:
                  - {function: scx_bpf_dsq_move_to_local___v2, file: kernel/sched/ext.c, line: 8538, call: "consume_dispatch_q(sch, dspc->rq, dsq, enq_flags)", held: [{lock: rq, instance: dspc->rq}]}
                  - {function: consume_dispatch_q, file: kernel/sched/ext.c, line: 2549, call: "consume_remote_task(rq, p, enq_flags, dsq, task_rq)", held: [{lock: rq, instance: rq}, {lock: dsq, instance: dsq}], note: "after the guard at 2548"}
                  - {function: consume_remote_task, file: kernel/sched/ext.c, line: 2433, call: "move_remote_task_to_local_dsq(p, enq_flags, src_rq, this_rq)", held: [{lock: rq, instance: src_rq}]}
                  - {function: move_remote_task_to_local_dsq, file: kernel/sched/ext.c, line: 2292, held: [{lock: rq, instance: src_rq}]}
              - root: scx_bpf_dsq_move_to_local___v2
                steps:
                  - {function: scx_bpf_dsq_move_to_local___v2, file: kernel/sched/ext.c, line: 8530, call: "flush_dispatch_buf(sch, dspc->rq)", held: [{lock: rq, instance: dspc->rq}]}
                  - {function: flush_dispatch_buf, file: kernel/sched/ext.c, line: 2757, call: "finish_dispatch(sch, rq, ent->task, ent->qseq, ent->dsq_id, ent->enq_flags)", held: [{lock: rq, instance: rq}]}
                  - {function: finish_dispatch, file: kernel/sched/ext.c, line: 2744, call: "dispatch_to_local_dsq(sch, rq, dsq, p, enq_flags)", held: [{lock: rq, instance: rq}]}
                  - {function: dispatch_to_local_dsq, file: kernel/sched/ext.c, line: 2644, call: "move_remote_task_to_local_dsq(p, enq_flags, src_rq, dst_rq)", held: [{lock: rq, instance: src_rq}], note: "after the guard at 2601"}
                  - {function: move_remote_task_to_local_dsq, file: kernel/sched/ext.c, line: 2292, held: [{lock: rq, instance: src_rq}]}
        applies_to: [scx_bpf_dsq_move, scx_bpf_dsq_move_vtime, scx_bpf_dsq_move_to_local, scx_bpf_dsq_move_to_local___v2]
        enforcement:
