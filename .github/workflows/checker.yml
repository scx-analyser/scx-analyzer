name: checker
on:
  push:
    branches: [main]
  pull_request:
jobs:
  checker-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r checker/requirements.txt
      - run: python -m unittest discover -s checker/tests -v
      - run: python -m checker check --callgraph contracts/fixtures/callgraph.example.json --catalog contracts/fixtures/catalog.example.yaml
      - run: python -m checker check -o "${{ runner.temp }}/scxa-findings.json"
  minimum-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r checker/requirements.txt "jsonschema==4.18.0" "PyYAML==6.0.3"
      - run: python -m unittest discover -s checker/tests -v
